<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스도쿠</title>
<meta name="description" content="입문부터 극한까지 7단계 난이도의 클래식 9×9 스도쿠">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스도쿠">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* 기본 초기화: 폰 노치·홈 바 영역(safe area)만큼 위아래 여백 확보 */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 위 상태줄 → 정사각 판 → 도구 줄 → 숫자 패드, 폭은 판 기준 최대 480px */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #17202C;
  --muted: #667286;
  --line: #CCD3DD;
  --line-strong: #2A3444;
  --grid-thin: #E2E6EC;   /* 칸 사이 선 */
  --grid-thick: #1B2330;  /* 3×3 박스 경계선 */
  --accent: #2F55D4;
  --accent-ink: #FFFFFF;
  --accent-soft: #D5DEFA;
  --peer: #EEF2F8;
  --same: #C3D1F7;
  --error: #C8352E;
  --error-soft: #FBE1DF;
  --hint: #0E8A6B;
  --font-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-digit: "Lexend", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141B; --surface: #19202A; --ink: #E5E9F0; --muted: #8B96A8;
    --line: #2C3544; --line-strong: #8D98AA; --grid-thin: #29313D; --grid-thick: #A9B3C4; --accent: #7F9CFF; --accent-ink: #0E1320;
    --accent-soft: #263257; --peer: #1F2733; --same: #31406A; --error: #FF7B72;
    --error-soft: #3A1F1F; --hint: #4FD1A8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141B; --surface: #19202A; --ink: #E5E9F0; --muted: #8B96A8;
  --line: #2C3544; --line-strong: #8D98AA; --grid-thin: #29313D; --grid-thick: #A9B3C4; --accent: #7F9CFF; --accent-ink: #0E1320;
  --accent-soft: #263257; --peer: #1F2733; --same: #31406A; --error: #FF7B72;
  --error-soft: #3A1F1F; --hint: #4FD1A8; color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
body {
  height: 100%; box-sizing: border-box;
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
h1 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: -0.02em; }
h1 small { font-weight: 400; font-size: .85rem; color: var(--muted); letter-spacing: .08em; margin-left: 8px; }

/* 난이도 막대: 단계가 오를수록 하나씩 켜진다 */
.pips { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
.pips i { width: 3px; border-radius: 1px; background: currentColor; opacity: .22; }
.pips i.on { opacity: .9; }

/* 시작 화면 */
.home { max-width: 480px; margin: 0 auto; padding-block: 28px 32px; display: flex; flex-direction: column; gap: 12px; }
.home-head { margin-bottom: 6px; }
.continue {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  border: 0; border-radius: 14px; padding: 16px 18px; background: var(--accent); color: var(--accent-ink); font: inherit;
}
.continue .c-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.continue b { font: 800 1.05rem var(--font-display); }
.continue small { font: 400 .82rem var(--font-digit); opacity: .85; font-variant-numeric: tabular-nums; }
.continue svg, .lv-row svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.section-label { margin: 10px 0 0; font-size: .75rem; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
.level-list { display: flex; flex-direction: column; gap: 8px; }
.lv-row {
  display: grid; grid-template-columns: 34px 1fr auto 20px; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 13px 14px 13px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  font: inherit; cursor: pointer;
}
.lv-row:hover { border-color: var(--accent); }
.lv-row:active { background: var(--accent-soft); }
.lv-row .pips { height: 14px; gap: 2px; }
.lv-row .pips i { width: 3px; }
.lv-row svg { color: var(--muted); width: 18px; height: 18px; }
.lv-name { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lv-name b { font: 800 1.05rem var(--font-display); }
.lv-name small { font-size: .75rem; color: var(--muted); }
.lv-best { font: 400 .72rem var(--font-body); color: var(--muted); text-align: right; white-space: nowrap; }
.lv-best b { display: block; font: 400 .95rem var(--font-digit); color: var(--ink); font-variant-numeric: tabular-nums; }
.continue:focus-visible, .lv-row:focus-visible, .backbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 게임 화면: 화면 높이에 맞춰 판 크기를 정해 스크롤 없이 한 화면에 들어오게 한다 */
.game { max-width: 520px; margin: 0 auto; height: 100%; box-sizing: border-box; padding-block: 8px 12px; display: flex; flex-direction: column; gap: 10px; }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.backbtn {
  display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--ink);
  font: 600 .95rem var(--font-body); padding: 6px 8px 6px 0; cursor: pointer; border-radius: 8px;
}
.backbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.lvl-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 700 .88rem var(--font-body); }
/* 판·숫자 패드·도구 줄을 한 묶음으로 세로 가운데 정렬. 판 크기는 남는 높이에 맞춰 스크립트로 정한다 */
.play { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.play .board-wrap { flex: none; align-self: center; }
.win-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.status b.warn { color: var(--error); font-weight: 600; }
.overlay h2.fail-title { color: var(--error); }
.fail-home { margin-top: 10px; }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .95rem var(--font-body); padding: 10px 22px; border-radius: 999px; cursor: pointer; }
.btn-primary:focus-visible, .btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pausebtn { border: 0; background: none; color: var(--ink); cursor: pointer; padding: 2px; margin-left: 4px; border-radius: 6px; display: inline-grid; place-items: center; vertical-align: middle; }
.pausebtn svg { width: 18px; height: 18px; fill: currentColor; }
.pausebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.board { transition: filter .2s ease; }
.board-wrap.is-paused .board { filter: blur(14px); }
.overlay.pause-pop { background: color-mix(in srgb, var(--bg) 35%, transparent); }
.pause-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px 28px; box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 18%, transparent); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 12px; }
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }

.status { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--muted); }
.status b { font-family: var(--font-digit); font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 4px; }
.status .grp { display: flex; gap: 16px; }
.linkbtn { border: 0; background: none; color: var(--accent); font: 600 .85rem var(--font-body); cursor: pointer; padding: 4px 0; }

.confirm {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .88rem;
}
.confirm .btns { display: flex; gap: 8px; }
.confirm button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .85rem var(--font-body); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.confirm button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.board-wrap { position: relative; width: 100%; container-type: inline-size; }
.board {
  display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); aspect-ratio: 1; width: 100%; max-width: 100%; box-sizing: border-box;
  background: var(--surface); border: 3px solid var(--grid-thick); border-radius: 6px; overflow: hidden;
  user-select: none;
}
.cell {
  position: relative; border: 0; margin: 0; padding: 0; background: var(--surface); color: var(--ink);
  border-right: 1px solid var(--grid-thin); border-bottom: 1px solid var(--grid-thin);
  font-family: var(--font-digit); font-size: clamp(1.2rem, 5.6vw, 1.75rem); font-size: 6.4cqw; font-weight: 300;
  display: grid; place-items: center; cursor: pointer; min-width: 0; min-height: 0;
}
.cell:nth-child(9n) { border-right: 0; }
.cell.c2, .cell.c5 { border-right: 3px solid var(--grid-thick); }
.cell.r2, .cell.r5 { border-bottom: 3px solid var(--grid-thick); }
.cell.r8 { border-bottom: 0; }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; z-index: 1; }
.cell.peer { background: var(--peer); }
.cell.same { background: var(--same); }
.cell.sel { background: var(--accent-soft); }
.cell.given { font-weight: 600; }
.cell.entered { color: var(--accent); }
.cell.hinted { color: var(--hint); }
.cell.err { color: var(--error); background: var(--error-soft); }
.cell.sel.err { box-shadow: inset 0 0 0 2px var(--error); }
.notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.notes span { display: grid; place-items: center; font-size: clamp(.5rem, 2.2vw, .7rem); font-size: 2.5cqw; color: var(--muted); font-weight: 400; line-height: 1; }
.notes span.hl { color: var(--accent); font-weight: 600; }

.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  background: color-mix(in srgb, var(--surface) 88%, transparent); border-radius: 6px;
}
.overlay h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; margin: 0 0 6px; }
.overlay p { margin: 0 0 16px; color: var(--muted); font-variant-numeric: tabular-nums; }

.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px;
  border: 0; background: transparent; color: var(--ink); font: 600 .78rem var(--font-body); cursor: pointer; border-radius: 10px;
}
.tool svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--surface); }
.tool:focus-visible, .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tool .badge { font: 600 .65rem var(--font-body); padding: 1px 6px; border-radius: 999px; background: var(--line); color: var(--muted); }
.tool[aria-pressed="true"] { color: var(--accent); }
.tool[aria-pressed="true"] .badge { background: var(--accent); color: var(--accent-ink); }

.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.key {
  border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 10px;
  font-family: var(--font-digit); font-size: clamp(1.2rem, 5.4vw, 1.6rem); font-weight: 400;
  padding: 6px 0 3px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.key small { font-size: .6rem; color: var(--muted); font-family: var(--font-body); }
.key:active { background: var(--accent-soft); }
.key.done { color: var(--hint); background: color-mix(in srgb, var(--hint) 12%, var(--surface)); border-color: color-mix(in srgb, var(--hint) 35%, var(--line)); cursor: default; justify-content: center; pointer-events: none; }
.key.done svg { width: 1.35em; height: 1.35em; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

.btn-primary { border: 0; background: var(--accent); color: var(--accent-ink); font: 600 .95rem var(--font-body); padding: 10px 22px; border-radius: 999px; cursor: pointer; }
.help { font-size: .78rem; color: var(--muted); text-align: center; line-height: 1.6; margin: 0; }
.help kbd { font-family: var(--font-digit); font-size: .72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }
.help { display: none; }
@media (hover: hover) and (pointer: fine) { .help { display: block; } }
.ver { font: 400 .7rem var(--font-digit); color: var(--muted); text-align: center; margin: 0; opacity: .7; }
@media (prefers-reduced-motion: no-preference) {
  .cell { transition: background-color .12s ease; }
  .overlay { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
</style>

</head>
<body>
<main class="home" id="home">
  <header class="home-head">
    <h1>스도쿠<small>SUDOKU</small></h1>
  </header>

  <button type="button" class="continue" id="continueBtn" hidden>
    <span class="c-text"><b>이어하기</b><small id="continueMeta"></small></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
  </button>

  <div class="confirm" id="confirm" hidden>
    <span id="confirmText"></span>
    <div class="btns">
      <button type="button" id="confirmNo">취소</button>
      <button type="button" class="primary" id="confirmYes">새로 시작</button>
    </div>
  </div>

  <p class="section-label">난이도</p>
  <div class="level-list" id="levelList"></div>

  <p class="help"><kbd>1</kbd>–<kbd>9</kbd> 입력 · <kbd>←↑→↓</kbd> 이동 · <kbd>Backspace</kbd> 지우기 · <kbd>N</kbd> 메모 · <kbd>P</kbd> 일시정지 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 되돌리기 · <kbd>Esc</kbd> 목록</p>
  <p class="ver" id="ver"></p>
</main>

<main class="game" id="game" hidden>
  <div class="topbar">
    <button type="button" class="backbtn" id="backBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>목록
    </button>
    <span class="lvl-chip"><span class="pips" id="lvlPips" aria-hidden="true"></span><span id="lvlName"></span></span>
  </div>

  <div class="play" id="play">
    <div class="status">
      <div class="grp">
        <span>시간<b id="time">00:00</b><button type="button" class="pausebtn" id="pauseBtn" aria-label="일시정지"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button></span>
        <span>실수<b id="mistakes">0/3</b></span>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="스도쿠 판"></div>
      <div class="overlay" id="win" hidden>
        <div>
          <h2>완성했어요</h2>
          <p id="winText"></p>
          <div class="win-btns">
            <button type="button" class="btn-primary" id="winNew">한 판 더</button>
            <button type="button" class="btn-ghost" id="winHome">목록으로</button>
          </div>
        </div>
      </div>
      <div class="overlay" id="fail" hidden>
        <div>
          <h2 class="fail-title">실패</h2>
          <p id="failText"></p>
          <div class="win-btns">
            <button type="button" class="btn-primary" id="failRetry">같은 문제 다시</button>
            <button type="button" class="btn-ghost" id="failNew">새 문제</button>
          </div>
          <button type="button" class="linkbtn fail-home" id="failHome">목록으로</button>
        </div>
      </div>
      <div class="overlay pause-pop" id="pausedBox" hidden>
        <div class="pause-card">
          <h2>일시정지</h2>
          <p id="pausedText"></p>
          <button type="button" class="btn-primary" id="resumeBtn">계속하기</button>
        </div>
      </div>
      <div class="overlay" id="busy" hidden>
        <div>
          <div class="spinner"></div>
          <p id="busyText">문제를 만드는 중이에요</p>
        </div>
      </div>
    </div>

    <div class="pad" id="pad"></div>

    <div class="tools">
      <button type="button" class="tool" id="undoBtn">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>되돌리기
      </button>
      <button type="button" class="tool" id="eraseBtn">
        <svg viewBox="0 0 24 24"><path d="M20 20H8l-4-4 10-10 7 7-7 7"/><path d="m9 11 6 6"/></svg>지우기
      </button>
      <button type="button" class="tool" id="noteBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg>
        <span>메모 <span class="badge" id="noteBadge">OFF</span></span>
      </button>
      <button type="button" class="tool" id="hintBtn">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span>힌트 <span class="badge" id="hintBadge">3</span></span>
      </button>
    </div>
  </div>
</main>

<script>
/* 문제 생성기와 기법 기반 난이도 판정기. Web Worker 에도 같은 소스를 넘긴다. */
function SudokuGenFactory() {
  const ROW = [], COL = [], BOX = [];
  for (let i = 0; i < 81; i++) { ROW.push(Math.floor(i / 9)); COL.push(i % 9); BOX.push(Math.floor(i / 27) * 3 + Math.floor((i % 9) / 3)); }
  const ROWS = [], COLS = [], BOXES = [];
  for (let k = 0; k < 9; k++) { ROWS.push([]); COLS.push([]); BOXES.push([]); }
  for (let i = 0; i < 81; i++) { ROWS[ROW[i]].push(i); COLS[COL[i]].push(i); BOXES[BOX[i]].push(i); }
  const UNITS = ROWS.concat(COLS, BOXES);
  const IS_PEER = new Uint8Array(81 * 81);
  const PEERS = [];
  for (let i = 0; i < 81; i++) {
    const s = [];
    for (let j = 0; j < 81; j++) if (i !== j && (ROW[i] === ROW[j] || COL[i] === COL[j] || BOX[i] === BOX[j])) { s.push(j); IS_PEER[i * 81 + j] = 1; }
    PEERS.push(s);
  }
  const POP = new Uint8Array(1024);
  for (let m = 1; m < 1024; m++) POP[m] = POP[m >> 1] + (m & 1);
  const lowDigit = m => 31 - Math.clz32(m & -m);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

  // 백트래킹: limit 개까지 해의 수를 센다. fill 이면 첫 해를 g 에 남긴다.
  function solve(g, limit, randomize, fill) {
    const R = new Uint16Array(9), C = new Uint16Array(9), B = new Uint16Array(9);
    for (let i = 0; i < 81; i++) {
      const v = g[i]; if (!v) continue;
      const bit = 1 << v;
      if ((R[ROW[i]] | C[COL[i]] | B[BOX[i]]) & bit) return 0;
      R[ROW[i]] |= bit; C[COL[i]] |= bit; B[BOX[i]] |= bit;
    }
    let count = 0;
    const rec = () => {
      let best = -1, bestMask = 0, bestCnt = 10;
      for (let i = 0; i < 81; i++) {
        if (g[i]) continue;
        const m = ~(R[ROW[i]] | C[COL[i]] | B[BOX[i]]) & 0x3FE;
        const n = POP[m];
        if (n === 0) return false;
        if (n < bestCnt) { best = i; bestMask = m; bestCnt = n; if (n === 1) break; }
      }
      if (best < 0) { count++; return fill || count >= limit; }
      const r = ROW[best], c = COL[best], b = BOX[best];
      const digits = []; for (let d = 1; d <= 9; d++) if (bestMask & (1 << d)) digits.push(d);
      if (randomize) shuffle(digits);
      for (const d of digits) {
        const bit = 1 << d;
        g[best] = d; R[r] |= bit; C[c] |= bit; B[b] |= bit;
        if (rec()) { if (!fill) g[best] = 0; return true; }
        g[best] = 0; R[r] &= ~bit; C[c] &= ~bit; B[b] &= ~bit;
      }
      return false;
    };
    rec();
    return count;
  }

  function combos(arr, k, fn) {
    const pick = [];
    const rec = start => {
      if (pick.length === k) return fn(pick);
      for (let i = start; i <= arr.length - (k - pick.length); i++) {
        pick.push(arr[i]);
        if (rec(i + 1)) return true;
        pick.pop();
      }
      return false;
    };
    return rec(0);
  }

  // 사람이 쓰는 기법 순서대로 풀어 보고, 필요했던 가장 어려운 기법 단계를 반환한다.
  // 1: 싱글 · 2: 교차·페어 · 3: 트리플·X-Wing · 4: 쿼드·Swordfish·XY-Wing · 5: 기법으로 풀리지 않음
  function grade(puzzle) {
    const v = Array.from(puzzle);
    const cand = new Uint16Array(81);
    let left = 0;
    for (let i = 0; i < 81; i++) if (!v[i]) { cand[i] = 0x3FE; left++; }
    for (let i = 0; i < 81; i++) if (v[i]) for (const p of PEERS[i]) cand[p] &= ~(1 << v[i]);

    const place = (i, d) => { v[i] = d; cand[i] = 0; left--; for (const p of PEERS[i]) cand[p] &= ~(1 << d); };
    const elim = (i, mask) => { if (!v[i] && (cand[i] & mask)) { cand[i] &= ~mask; return true; } return false; };

    function singles() {
      for (let i = 0; i < 81; i++) if (!v[i] && POP[cand[i]] === 1) { place(i, lowDigit(cand[i])); return true; }
      for (const u of UNITS) {
        for (let d = 1; d <= 9; d++) {
          const bit = 1 << d; let pos = -1, n = 0, placed = false;
          for (const i of u) { if (v[i] === d) { placed = true; break; } if (cand[i] & bit) { pos = i; n++; } }
          if (!placed && n === 1) { place(pos, d); return true; }
        }
      }
      return false;
    }

    function locked() {
      for (let b = 0; b < 9; b++) {
        for (let d = 1; d <= 9; d++) {
          const bit = 1 << d; let rows = 0, cols = 0, n = 0;
          for (const i of BOXES[b]) if (cand[i] & bit) { rows |= 1 << ROW[i]; cols |= 1 << COL[i]; n++; }
          if (n < 2) continue;
          let ch = false;
          if (POP[rows] === 1) { const r = lowDigit(rows); for (const i of ROWS[r]) if (BOX[i] !== b) ch = elim(i, bit) || ch; }
          if (POP[cols] === 1) { const c = lowDigit(cols); for (const i of COLS[c]) if (BOX[i] !== b) ch = elim(i, bit) || ch; }
          if (ch) return true;
        }
      }
      for (const lines of [ROWS, COLS]) {
        for (const line of lines) {
          for (let d = 1; d <= 9; d++) {
            const bit = 1 << d; let boxes = 0, n = 0;
            for (const i of line) if (cand[i] & bit) { boxes |= 1 << BOX[i]; n++; }
            if (n < 2 || POP[boxes] !== 1) continue;
            const b = lowDigit(boxes); let ch = false;
            for (const i of BOXES[b]) if (!line.includes(i)) ch = elim(i, bit) || ch;
            if (ch) return true;
          }
        }
      }
      return false;
    }

    function nakedSubset(k) {
      for (const u of UNITS) {
        const open = u.filter(i => !v[i] && POP[cand[i]] >= 2 && POP[cand[i]] <= k);
        if (open.length < k) continue;
        const hit = combos(open, k, pick => {
          let union = 0; for (const i of pick) union |= cand[i];
          if (POP[union] !== k) return false;
          let ch = false;
          for (const i of u) if (!pick.includes(i)) ch = elim(i, union) || ch;
          return ch;
        });
        if (hit) return true;
      }
      return false;
    }

    function hiddenSubset(k) {
      for (const u of UNITS) {
        const ds = [], posOf = {};
        for (let d = 1; d <= 9; d++) {
          const bit = 1 << d; let pos = 0, placed = false;
          for (let j = 0; j < 9; j++) { const i = u[j]; if (v[i] === d) { placed = true; break; } if (cand[i] & bit) pos |= 1 << j; }
          if (!placed && POP[pos] >= 2 && POP[pos] <= k) { ds.push(d); posOf[d] = pos; }
        }
        if (ds.length < k) continue;
        const hit = combos(ds, k, pick => {
          let pos = 0, dm = 0; for (const d of pick) { pos |= posOf[d]; dm |= 1 << d; }
          if (POP[pos] !== k) return false;
          let ch = false;
          for (let j = 0; j < 9; j++) if (pos & (1 << j)) ch = elim(u[j], 0x3FE & ~dm) || ch;
          return ch;
        });
        if (hit) return true;
      }
      return false;
    }

    function fish(k) {
      for (let d = 1; d <= 9; d++) {
        const bit = 1 << d;
        for (const [base, cover] of [[ROWS, COLS], [COLS, ROWS]]) {
          const lines = [], posOf = [];
          for (let l = 0; l < 9; l++) {
            let pos = 0; for (let j = 0; j < 9; j++) if (cand[base[l][j]] & bit) pos |= 1 << j;
            if (POP[pos] >= 2 && POP[pos] <= k) { lines.push(l); posOf[l] = pos; }
          }
          if (lines.length < k) continue;
          const hit = combos(lines, k, pick => {
            let pos = 0; for (const l of pick) pos |= posOf[l];
            if (POP[pos] !== k) return false;
            let ch = false;
            for (let j = 0; j < 9; j++) {
              if (!(pos & (1 << j))) continue;
              for (let l = 0; l < 9; l++) if (!pick.includes(l)) ch = elim(cover[j][l], bit) || ch;
            }
            return ch;
          });
          if (hit) return true;
        }
      }
      return false;
    }

    function xyWing() {
      for (let p = 0; p < 81; p++) {
        if (v[p] || POP[cand[p]] !== 2) continue;
        const pm = cand[p];
        const wings = PEERS[p].filter(i => !v[i] && POP[cand[i]] === 2 && cand[i] !== pm && POP[cand[i] & pm] === 1);
        for (const a of wings) {
          const z = cand[a] & ~pm, y = pm & ~cand[a];
          for (const b of wings) {
            if (b === a || cand[b] !== (y | z)) continue;
            let ch = false;
            for (const i of PEERS[a]) if (i !== b && i !== p && IS_PEER[i * 81 + b]) ch = elim(i, z) || ch;
            if (ch) return true;
          }
        }
      }
      return false;
    }

    let max = 1;
    while (left > 0) {
      if (singles()) continue;
      if (locked() || nakedSubset(2) || hiddenSubset(2)) { if (max < 2) max = 2; continue; }
      if (nakedSubset(3) || hiddenSubset(3) || fish(2)) { if (max < 3) max = 3; continue; }
      if (nakedSubset(4) || hiddenSubset(4) || fish(3) || xyWing()) { if (max < 4) max = 4; continue; }
      return 5;
    }
    return max;
  }

  // cfg: { tech: 목표 기법 단계, givens: 남길 숫자 수 상한(없으면 최대한 지움) }
  function generate(cfg, budgetMs) {
    const t0 = Date.now();
    let best = null, tries = 0;
    do {
      tries++;
      const solution = new Array(81).fill(0);
      solve(solution, 1, true, true);
      const p = solution.slice();
      let givens = 81;
      for (const i of shuffle([...Array(81).keys()])) {
        if (cfg.givens && givens <= cfg.givens) break;
        const keep = p[i]; p[i] = 0;
        if (solve(p.slice(), 2, false, false) !== 1 || (cfg.tech < 5 && grade(p) > cfg.tech)) { p[i] = keep; continue; }
        givens--;
      }
      const tech = grade(p);
      const res = { puzzle: p, solution, tech, givens, tries };
      if (tech === cfg.tech) return res;
      if (!best || Math.abs(tech - cfg.tech) < Math.abs(best.tech - cfg.tech)) best = res;
    } while (Date.now() - t0 < budgetMs);
    best.tries = tries;
    return best;
  }

  return { generate, grade };
}
</script>

<script>
(() => {
  // tech: 풀 때 필요한 가장 어려운 기법 단계 (판정기 기준), givens: 처음 보이는 숫자 수 (없으면 정답이 하나로 유지되는 한 최대한 지움)
  const LEVELS = [
    { label: '입문', tech: 1, givens: 46 },
    { label: '쉬움', tech: 1, givens: 38 },
    { label: '보통', tech: 1, givens: 30 },
    { label: '어려움', tech: 2 },   // 교차(박스·줄), 숫자 짝
    { label: '전문가', tech: 3 },   // 세 칸 묶음, X-Wing
    { label: '마스터', tech: 4 },   // 네 칸 묶음, Swordfish, XY-Wing
    { label: '극한', tech: 5 },     // 위 기법으로 풀리지 않음
  ];
  const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>';
  const CHEVRON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  const HINTS = 3;
  const MAX_MISTAKES = 3;  // 이 횟수만큼 틀리면 실패
  const KEY = 'classic-sudoku-v1';
  const STATS_KEY = 'classic-sudoku-stats';
  const Gen = SudokuGenFactory();
  let worker = null;
  try {
    const src = 'const G = (' + SudokuGenFactory.toString() + ')();\nonmessage = e => postMessage(G.generate(e.data.cfg, e.data.budget));';
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  } catch (e) { worker = null; }
  const cfgOf = level => ({ tech: LEVELS[level].tech, givens: LEVELS[level].givens || 0 });
  function generateAsync(level) {
    const msg = { cfg: cfgOf(level), budget: 5000 };
    const local = () => Gen.generate(msg.cfg, msg.budget);
    if (!worker) return new Promise(res => setTimeout(() => res(local()), 30));
    return new Promise(res => {
      const w = worker;
      const done = () => { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); };
      const onMsg = e => { done(); res(e.data); };
      const onErr = () => { done(); worker = null; res(local()); };
      w.addEventListener('message', onMsg); w.addEventListener('error', onErr);
      w.postMessage(msg);
    });
  }

  // 각 칸의 같은 행·열·박스 칸 목록
  const PEERS = [];
  for (let i = 0; i < 81; i++) {
    const r = Math.floor(i / 9), c = i % 9, br = r - r % 3, bc = c - c % 3, s = new Set();
    for (let k = 0; k < 9; k++) { s.add(r * 9 + k); s.add(k * 9 + c); s.add((br + Math.floor(k / 3)) * 9 + bc + k % 3); }
    s.delete(i); PEERS.push([...s]);
  }

  // 상태 (저장된 게임이 없으면 null)
  let S = null;
  const fresh = (level, gen) => {
    const { puzzle, solution } = gen;
    return { level, tech: gen.tech, puzzle, solution, values: puzzle.slice(), notes: new Array(81).fill(0), hinted: new Array(81).fill(false),
      mistakes: 0, seconds: 0, hintsLeft: HINTS, done: false, failed: false, paused: false, sel: puzzle.indexOf(0), history: [] };
  };
  const blank = level => fresh(level, { puzzle: new Array(81).fill(0), solution: new Array(81).fill(0), tech: 0 });
  const save = () => { if (!S || busy) return; try { const { history, ...rest } = S; localStorage.setItem(KEY, JSON.stringify(rest)); } catch (e) {} };
  const load = () => {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (!s || !s.puzzle || s.puzzle.length !== 81 || !s.solution.some(Boolean)) return null;
      if (typeof s.level !== 'number') s.level = { easy: 1, medium: 2, hard: 3 }[s.diff] ?? 2; // 3단계 시절 저장본
      if (!s.done && !s.failed && s.mistakes >= MAX_MISTAKES) s.mistakes = MAX_MISTAKES - 1; // 실수 제한 도입 전 저장본은 한 번의 기회를 남긴다
      return { ...s, history: [] };
    } catch (e) { return null; }
  };
  const loadStats = () => { try { const t = JSON.parse(localStorage.getItem(STATS_KEY)); if (t && t.best && t.solved) return t; } catch (e) {} return { best: {}, solved: {} }; };
  const saveStats = t => { try { localStorage.setItem(STATS_KEY, JSON.stringify(t)); } catch (e) {} };
  let noteMode = false;
  let busy = false, busyLevel = 0;
  let screen = 'home';
  let lastWinBest = false;

  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  const pipsHtml = idx => { let h = ''; for (let k = 0; k < 7; k++) h += '<i class="' + (k <= idx ? 'on' : '') + '" style="height:' + (40 + k * 10) + '%"></i>'; return h; };
  const $ = id => document.getElementById(id);

  // 시작 화면: 난이도 목록
  const levelRows = LEVELS.map((lv, idx) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lv-row'; b.id = 'lv-' + idx;
    b.innerHTML = '<span class="pips" aria-hidden="true">' + pipsHtml(idx) + '</span>' +
      '<span class="lv-name"><b>' + lv.label + '</b><small>' + (idx + 1) + '단계</small></span>' +
      '<span class="lv-best" id="best-' + idx + '"></span>' + CHEVRON_SVG;
    b.addEventListener('click', () => chooseLevel(idx));
    $('levelList').appendChild(b);
    return b;
  });

  const over = () => S.done || !!S.failed;
  const mistakeText = () => S.mistakes + '/' + MAX_MISTAKES;
  const hasGame = () => !!S && !over() && !busy && S.solution.some(Boolean);
  const inProgress = () => hasGame() && (S.seconds > 0 || S.values.some((v, i) => v && S.puzzle[i] === 0));

  function renderHome() {
    const cont = $('continueBtn');
    cont.hidden = !inProgress();
    if (!cont.hidden) $('continueMeta').textContent = LEVELS[S.level].label + ' · ' + fmt(S.seconds) + ' · 실수 ' + mistakeText();
    const st = loadStats();
    LEVELS.forEach((lv, idx) => {
      const best = st.best[idx], n = st.solved[idx] || 0;
      $('best-' + idx).innerHTML = best != null ? '최고 기록<b>' + fmt(best) + '</b>' : '';
      levelRows[idx].setAttribute('aria-label', (idx + 1) + '단계 ' + lv.label + (best != null ? ', 최고 기록 ' + fmt(best) + ', ' + n + '판 완성' : ''));
    });
  }

  // 화면 전환: 게임 화면은 주소 끝에 #play 를 붙여 폰의 뒤로가기로 목록에 돌아오게 한다
  function showScreen(name, push = true) {
    screen = name;
    $('home').hidden = name !== 'home';
    $('game').hidden = name !== 'game';
    if (name === 'game') {
      if (push && location.hash !== '#play') history.pushState(null, '', '#play');
      render(); fitBoard();
    } else {
      $('confirm').hidden = true; pendingLevel = null;
      renderHome();
    }
    window.scrollTo(0, 0);
  }
  function goHome() {
    if (location.hash === '#play') history.back();
    else showScreen('home', false);
  }
  window.addEventListener('popstate', () => { showScreen(location.hash === '#play' && S ? 'game' : 'home', false); });

  // 게임 화면 구성
  const board = $('board');
  const cells = [];
  for (let i = 0; i < 81; i++) {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'cell-' + i;
    b.className = 'cell c' + (i % 9) + ' r' + Math.floor(i / 9);
    b.setAttribute('role', 'gridcell');
    b.addEventListener('click', () => { if (!S || busy) return; S.sel = i; render(); });
    board.appendChild(b); cells.push(b);
  }
  const keys = [];
  for (let d = 1; d <= 9; d++) {
    const k = document.createElement('button');
    k.type = 'button'; k.className = 'key'; k.id = 'key-' + d;
    k.addEventListener('click', () => input(d));
    $('pad').appendChild(k); keys.push(k);
  }

  // 판 크기 = min(묶음 너비, 묶음 높이 - 상태줄·숫자 패드·도구 줄 높이)
  const playEl = $('play'), wrapEl = document.querySelector('.board-wrap');
  function fitBoard() {
    if ($('game').hidden) return;
    const gap = parseFloat(getComputedStyle(playEl).rowGap) || 0;
    const others = [...playEl.children].filter(el => el !== wrapEl).reduce((h, el) => h + el.offsetHeight, 0);
    const avail = playEl.clientHeight - others - gap * (playEl.children.length - 1);
    const size = Math.floor(Math.max(180, Math.min(playEl.clientWidth, avail)));
    wrapEl.style.width = wrapEl.style.height = size + 'px';
  }
  if (window.ResizeObserver) new ResizeObserver(fitBoard).observe(playEl);
  window.addEventListener('resize', fitBoard);

  function render() {
    if (!S) return;
    const sel = S.sel, selVal = sel >= 0 ? S.values[sel] : 0;
    const peerSet = new Set(sel >= 0 ? PEERS[sel] : []);
    for (let i = 0; i < 81; i++) {
      const el = cells[i], v = S.values[i], given = S.puzzle[i] !== 0;
      const err = v && !given && v !== S.solution[i];
      el.classList.toggle('given', given);
      el.classList.toggle('entered', !given && !!v && !S.hinted[i]);
      el.classList.toggle('hinted', !given && !!v && S.hinted[i]);
      el.classList.toggle('err', !!err);
      el.classList.toggle('sel', i === sel && !busy);
      el.classList.toggle('same', i !== sel && !!selVal && v === selVal);
      el.classList.toggle('peer', i !== sel && !busy && peerSet.has(i) && !(selVal && v === selVal));
      if (v) { el.textContent = v; }
      else if (S.notes[i]) {
        let h = '<span class="notes">';
        for (let d = 1; d <= 9; d++) h += '<span' + (selVal === d ? ' class="hl"' : '') + '>' + ((S.notes[i] >> d) & 1 ? d : '') + '</span>';
        el.innerHTML = h + '</span>';
      } else el.textContent = '';
      const r = Math.floor(i / 9) + 1, c = i % 9 + 1;
      el.setAttribute('aria-label', r + '행 ' + c + '열 ' + (v ? v : '빈 칸'));
    }
    const counts = new Array(10).fill(0);
    S.values.forEach((v, i) => { if (v && v === S.solution[i]) counts[v]++; });
    keys.forEach((k, idx) => {
      const d = idx + 1, left = 9 - counts[d], full = left === 0;
      const html = full ? CHECK_SVG : d + '<small>' + left + '</small>';
      if (k.dataset.html !== html) { k.innerHTML = html; k.dataset.html = html; }
      k.classList.toggle('done', full);
      k.disabled = full;
      k.setAttribute('aria-label', full ? d + ' 완성' : d + ' 입력, ' + left + '개 남음');
    });
    const shown = busy ? busyLevel : S.level;
    $('lvlName').textContent = LEVELS[shown].label;
    $('lvlPips').innerHTML = pipsHtml(shown);
    const showPause = !!S.paused && !over() && !busy;
    document.querySelector('.board-wrap').classList.toggle('is-paused', showPause);
    $('pausedBox').hidden = !showPause;
    if (showPause) $('pausedText').textContent = LEVELS[S.level].label + ' · ' + fmt(S.seconds);
    $('pauseBtn').hidden = over();
    $('mistakes').textContent = mistakeText();
    $('mistakes').classList.toggle('warn', S.mistakes >= MAX_MISTAKES - 1);
    $('time').textContent = fmt(S.seconds);
    $('hintBadge').textContent = S.hintsLeft;
    $('noteBtn').setAttribute('aria-pressed', noteMode);
    $('noteBadge').textContent = noteMode ? 'ON' : 'OFF';
    $('busy').hidden = !busy;
    if (busy) $('busyText').textContent = LEVELS[busyLevel].label + ' 문제를 만드는 중이에요';
    $('win').hidden = !S.done || busy;
    $('fail').hidden = !S.failed || busy;
    if (S.failed) $('failText').textContent = '실수 ' + mistakeText() + ' · ' + LEVELS[S.level].label + ' · ' + fmt(S.seconds);
    if (S.done) $('winText').textContent = (lastWinBest ? '최고 기록 · ' : '') +
      LEVELS[S.level].label + ' · ' + fmt(S.seconds) + ' · 실수 ' + mistakeText() + ' · 힌트 ' + (HINTS - S.hintsLeft) + '회';
  }

  const snapshot = () => { S.history.push({ values: S.values.slice(), notes: S.notes.slice(), hinted: S.hinted.slice() }); if (S.history.length > 200) S.history.shift(); };
  const editable = i => !!S && !busy && !S.paused && i >= 0 && !over() && S.puzzle[i] === 0 && !S.hinted[i];

  function recordWin() {
    const st = loadStats(), l = S.level;
    st.solved[l] = (st.solved[l] || 0) + 1;
    lastWinBest = st.best[l] == null || S.seconds < st.best[l];
    if (lastWinBest) st.best[l] = S.seconds;
    saveStats(st);
  }
  function place(i, d) {
    S.values[i] = d; S.notes[i] = 0;
    if (d === S.solution[i]) PEERS[i].forEach(p => { S.notes[p] &= ~(1 << d); });
    else { S.mistakes++; if (S.mistakes >= MAX_MISTAKES) { S.failed = true; return; } }
    if (S.values.every((v, k) => v === S.solution[k])) { S.done = true; recordWin(); }
  }

  const isComplete = d => S.values.filter((v, k) => v === d && v === S.solution[k]).length >= 9;
  function input(d) {
    const i = S ? S.sel : -1; if (!editable(i)) return;
    if (isComplete(d)) return; // 9개를 모두 맞게 채운 숫자는 입력·메모 모두 막는다
    if (noteMode) {
      if (S.values[i]) return;
      snapshot(); S.notes[i] ^= (1 << d);
    } else {
      if (S.values[i] === d) return;
      snapshot(); place(i, d);
    }
    save(); render();
  }
  function erase() {
    const i = S ? S.sel : -1; if (!editable(i) || (!S.values[i] && !S.notes[i])) return;
    snapshot(); S.values[i] = 0; S.notes[i] = 0; save(); render();
  }
  function undo() {
    if (!S || over() || busy || S.paused) return;
    const h = S.history.pop(); if (!h) return;
    S.values = h.values; S.notes = h.notes; S.hinted = h.hinted; save(); render();
  }
  function hint() {
    if (!S || over() || busy || S.paused || S.hintsLeft <= 0) return;
    let i = S.sel;
    if (!(i >= 0 && S.puzzle[i] === 0 && S.values[i] !== S.solution[i])) {
      const open = []; for (let k = 0; k < 81; k++) if (S.values[k] !== S.solution[k]) open.push(k);
      if (!open.length) return; i = open[Math.floor(Math.random() * open.length)];
    }
    snapshot(); S.hinted[i] = true; S.hintsLeft--; S.sel = i;
    const before = S.mistakes; place(i, S.solution[i]); S.mistakes = before;
    save(); render();
  }

  // 난이도 선택: 진행 중인 게임이 있으면 시작 화면에서 한 번 확인
  let pendingLevel = null;
  function chooseLevel(level) {
    if (busy) return;
    if (inProgress()) {
      pendingLevel = level;
      $('confirmText').textContent = '진행 중인 ' + LEVELS[S.level].label + ' 게임은 사라집니다. ' + LEVELS[level].label + ' 난이도로 새로 시작할까요?';
      $('confirm').hidden = false;
      $('confirmYes').focus();
    } else startNew(level);
  }
  async function startNew(level) {
    if (busy) return;
    $('confirm').hidden = true; pendingLevel = null;
    lastWinBest = false;
    S = blank(level); busy = true; busyLevel = level;
    showScreen('game');
    const gen = await generateAsync(level);
    S = fresh(level, gen); busy = false; save();
    if (screen === 'game') render(); else renderHome();
  }

  $('continueBtn').addEventListener('click', () => showScreen('game'));
  $('backBtn').addEventListener('click', goHome);
  $('winNew').addEventListener('click', () => startNew(S.level));
  $('winHome').addEventListener('click', goHome);
  // 실패 후: 같은 문제를 처음 상태로 되돌리거나 새 문제로 시작
  $('failRetry').addEventListener('click', () => {
    S = fresh(S.level, { puzzle: S.puzzle, solution: S.solution, tech: S.tech }); noteMode = false; save(); render();
  });
  $('failNew').addEventListener('click', () => startNew(S.level));
  $('failHome').addEventListener('click', goHome);
  $('confirmYes').addEventListener('click', () => { if (pendingLevel != null) startNew(pendingLevel); });
  $('confirmNo').addEventListener('click', () => { $('confirm').hidden = true; pendingLevel = null; });
  // 일시정지: 시간을 멈추고 판을 가린다. 앱을 내리거나 탭을 옮기면 자동으로 일시정지
  function setPaused(p) { if (!S || over() || busy || !!S.paused === p) return; S.paused = p; save(); render(); }
  $('pauseBtn').addEventListener('click', () => setPaused(true));
  $('resumeBtn').addEventListener('click', () => setPaused(false));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && screen === 'game') setPaused(true); });
  $('undoBtn').addEventListener('click', undo);
  $('eraseBtn').addEventListener('click', erase);
  $('hintBtn').addEventListener('click', hint);
  $('noteBtn').addEventListener('click', () => { noteMode = !noteMode; render(); });

  document.addEventListener('keydown', e => {
    if (screen !== 'game' || !S) return;
    if (e.key === 'Escape' && !S.paused) { goHome(); return; }
    if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'p') { setPaused(!S.paused); return; }
    if (S.paused) { if (e.key === 'Escape' || e.key === 'Enter') setPaused(false); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-9]$/.test(e.key)) { input(+e.key); return; }
    if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { erase(); return; }
    if (e.key.toLowerCase() === 'n') { noteMode = !noteMode; render(); return; }
    const mv = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (mv !== undefined) {
      e.preventDefault();
      let i = S.sel < 0 ? 0 : S.sel, r = Math.floor(i / 9), c = i % 9;
      if (mv === -9) r = (r + 8) % 9; if (mv === 9) r = (r + 1) % 9;
      if (mv === -1) c = (c + 8) % 9; if (mv === 1) c = (c + 1) % 9;
      S.sel = r * 9 + c; render(); cells[S.sel].focus();
    }
  });

  // 타이머: 게임 화면이 보일 때만 진행
  setInterval(() => {
    if (screen === 'game' && S && !over() && !busy && !S.paused && document.visibilityState === 'visible') {
      S.seconds++; $('time').textContent = fmt(S.seconds);
      if (S.seconds % 5 === 0) save();
    }
  }, 1000);

  // 시작: 항상 목록부터. 게임 중에 새로고침했다면(#play) 목록 위에 게임 화면을 다시 띄워 뒤로가기가 목록으로 오게 한다
  S = load();
  const resumePlay = location.hash === '#play' && hasGame();
  history.replaceState(null, '', location.pathname + location.search);
  showScreen('home', false);
  if (resumePlay) showScreen('game');
})();
</script>
<script>
// 버전: sw.js 의 CACHE, version.json 과 같은 숫자로 함께 올린다
const APP_VERSION = 8;
document.getElementById('ver').textContent = '버전 ' + APP_VERSION;

// 서버의 최신 버전을 확인하고, 더 새로우면 저장된 파일을 지우고 새로 불러온다.
// 홈 화면 앱이 서비스 워커 업데이트를 놓쳐도 이 확인으로 따라잡는다.
async function checkLatest() {
  try {
    const res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
    const latest = (await res.json()).version;
    if (!(latest > APP_VERSION)) return;
    let tried = null; try { tried = sessionStorage.getItem('sudoku-reload-for'); } catch (e) {}
    if (tried === String(latest)) return; // 서버 반영이 덜 된 경우 무한 새로고침 방지
    try { sessionStorage.setItem('sudoku-reload-for', String(latest)); } catch (e) {}
    if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
    location.reload();
  } catch (e) {}
}
checkLatest();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkLatest(); });
window.addEventListener('pageshow', e => { if (e.persisted) checkLatest(); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(reg => {
        // 앱을 다시 화면에 띄울 때마다 새 버전이 있는지 확인
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
      })
      .catch(() => {});
  });
  // 새 버전이 설치되면 한 번 새로고침해서 바로 반영 (진행 상황은 브라우저에 저장돼 있어 유지됨)
  if (navigator.serviceWorker.controller) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  }
}
</script>
