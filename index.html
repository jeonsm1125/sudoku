<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스도쿠</title>
<meta name="description" content="입문부터 극한까지 7단계 난이도의 클래식 9×9 스도쿠">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스도쿠">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* 기본 초기화: 폰 노치·홈 바 영역(safe area)만큼 위아래 여백 확보 */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 위 상태줄 → 정사각 판 → 도구 줄 → 숫자 패드, 폭은 판 기준 최대 480px */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #17202C;
  --muted: #667286;
  --line: #CCD3DD;
  --line-strong: #2A3444;
  --grid-thin: #E2E6EC;   /* 칸 사이 선 */
  --grid-thick: #1B2330;  /* 3×3 박스 경계선 */
  --accent: #2F55D4;
  --accent-ink: #FFFFFF;
  --accent-soft: #D5DEFA;
  --peer: #EEF2F8;
  --same: #C3D1F7;
  --error: #C8352E;
  --error-soft: #FBE1DF;
  --hint: #0E8A6B;
  --font-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-digit: "Lexend", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141B; --surface: #19202A; --ink: #E5E9F0; --muted: #8B96A8;
    --line: #2C3544; --line-strong: #8D98AA; --grid-thin: #29313D; --grid-thick: #A9B3C4; --accent: #7F9CFF; --accent-ink: #0E1320;
    --accent-soft: #263257; --peer: #1F2733; --same: #31406A; --error: #FF7B72;
    --error-soft: #3A1F1F; --hint: #4FD1A8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141B; --surface: #19202A; --ink: #E5E9F0; --muted: #8B96A8;
  --line: #2C3544; --line-strong: #8D98AA; --grid-thin: #29313D; --grid-thick: #A9B3C4; --accent: #7F9CFF; --accent-ink: #0E1320;
  --accent-soft: #263257; --peer: #1F2733; --same: #31406A; --error: #FF7B72;
  --error-soft: #3A1F1F; --hint: #4FD1A8; color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
/* 두 번 탭 확대 막기 (두 손가락 확대는 유지), 길게 눌렀을 때 글자 선택·복사 메뉴 막기 */
html { touch-action: manipulation; }
button, .cell, .key { touch-action: manipulation; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body {
  height: 100%; box-sizing: border-box;
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
h1 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: -0.02em; }
h1 small { font-weight: 400; font-size: .85rem; color: var(--muted); letter-spacing: .08em; margin-left: 8px; }

/* 난이도 막대: 단계가 오를수록 하나씩 켜진다 */
.pips { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
.pips i { width: 3px; border-radius: 1px; background: currentColor; opacity: .22; }
.pips i.on { opacity: .9; }

/* 시작 화면 */
.home { max-width: 480px; margin: 0 auto; padding-block: 28px 32px; display: flex; flex-direction: column; gap: 12px; }
.home-head { margin-bottom: 6px; }
.continue {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  border: 0; border-radius: 14px; padding: 16px 18px; background: var(--accent); color: var(--accent-ink); font: inherit;
}
.continue .c-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.continue b { font: 800 1.05rem var(--font-display); }
.continue small { font: 400 .82rem var(--font-digit); opacity: .85; font-variant-numeric: tabular-nums; }
.continue svg, .lv-row svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.section-label { margin: 10px 0 0; font-size: .75rem; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
.level-list { display: flex; flex-direction: column; gap: 8px; }
.lv-row {
  display: grid; grid-template-columns: 34px 1fr auto 20px; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 13px 14px 13px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  font: inherit; cursor: pointer;
}
.lv-row:hover { border-color: var(--accent); }
.lv-row:active { background: var(--accent-soft); }
.lv-row .pips { height: 14px; gap: 2px; }
.lv-row .pips i { width: 3px; }
.lv-row svg { color: var(--muted); width: 18px; height: 18px; }
.lv-name { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lv-name b { font: 800 1.05rem var(--font-display); }
.lv-name small { font-size: .75rem; color: var(--muted); }
.lv-best { font: 400 .72rem var(--font-body); color: var(--muted); text-align: right; white-space: nowrap; }
.lv-best b { display: block; font: 400 .95rem var(--font-digit); color: var(--ink); font-variant-numeric: tabular-nums; }
.continue:focus-visible, .lv-row:focus-visible, .backbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 게임 화면: 화면 높이에 맞춰 판 크기를 정해 스크롤 없이 한 화면에 들어오게 한다 */
.game { max-width: 520px; margin: 0 auto; height: 100%; box-sizing: border-box; padding-block: 8px 12px; display: flex; flex-direction: column; gap: 10px; }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.backbtn {
  display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--ink);
  font: 600 .95rem var(--font-body); padding: 6px 8px 6px 0; cursor: pointer; border-radius: 8px;
}
.backbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.lvl-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 700 .88rem var(--font-body); }
/* 판·숫자 패드·도구 줄을 한 묶음으로 세로 가운데 정렬. 판 크기는 남는 높이에 맞춰 스크립트로 정한다 */
.play { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.play .board-wrap { flex: none; align-self: center; }
.win-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.status b.warn { color: var(--error); font-weight: 600; }
.overlay h2.fail-title { color: var(--error); }
.fail-home { margin-top: 10px; }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .95rem var(--font-body); padding: 10px 22px; border-radius: 999px; cursor: pointer; }
.btn-primary:focus-visible, .btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pausebtn { border: 0; background: none; color: var(--ink); cursor: pointer; padding: 2px; margin-left: 4px; border-radius: 6px; display: inline-grid; place-items: center; vertical-align: middle; }
.pausebtn svg { width: 18px; height: 18px; fill: currentColor; }
.pausebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.board { transition: filter .2s ease; }
.board-wrap.is-paused .board { filter: blur(14px); }
.overlay.pause-pop { background: color-mix(in srgb, var(--bg) 35%, transparent); }
.pause-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px 28px; box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 18%, transparent); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 12px; }
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }

.status { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--muted); }
.status b { font-family: var(--font-digit); font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 4px; }
.status .grp { display: flex; gap: 16px; }
.linkbtn { border: 0; background: none; color: var(--accent); font: 600 .85rem var(--font-body); cursor: pointer; padding: 4px 0; }

.confirm {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .88rem;
}
.confirm .btns { display: flex; gap: 8px; }
.confirm button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .85rem var(--font-body); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.confirm button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.board-wrap { position: relative; width: 100%; container-type: inline-size; }
.board {
  display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); aspect-ratio: 1; width: 100%; max-width: 100%; box-sizing: border-box;
  background: var(--surface); border: 3px solid var(--grid-thick); border-radius: 6px; overflow: hidden;
  user-select: none;
}
.cell {
  position: relative; border: 0; margin: 0; padding: 0; background: var(--surface); color: var(--ink);
  border-right: 1px solid var(--grid-thin); border-bottom: 1px solid var(--grid-thin);
  font-family: var(--font-digit); font-size: clamp(1.2rem, 5.6vw, 1.75rem); font-size: 6.4cqw; font-weight: 300;
  display: grid; place-items: center; cursor: pointer; min-width: 0; min-height: 0;
}
.cell:nth-child(9n) { border-right: 0; }
.cell.c2, .cell.c5 { border-right: 3px solid var(--grid-thick); }
.cell.r2, .cell.r5 { border-bottom: 3px solid var(--grid-thick); }
.cell.r8 { border-bottom: 0; }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; z-index: 1; }
.cell.peer { background: var(--peer); }
.cell.same { background: var(--same); }
.cell.sel { background: var(--accent-soft); }
.cell.given { font-weight: 600; }
.cell.entered { color: var(--accent); }
.cell.hinted { color: var(--hint); }
.cell.err { color: var(--error); background: var(--error-soft); }
.cell.sel.err { box-shadow: inset 0 0 0 2px var(--error); }
.notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.notes span { display: grid; place-items: center; font-size: clamp(.5rem, 2.2vw, .7rem); font-size: 2.5cqw; color: var(--muted); font-weight: 400; line-height: 1; }
.notes span.hl { color: var(--accent); font-weight: 600; }

.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  background: color-mix(in srgb, var(--surface) 88%, transparent); border-radius: 6px;
}
.overlay h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; margin: 0 0 6px; }
.overlay p { margin: 0 0 16px; color: var(--muted); font-variant-numeric: tabular-nums; }

.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px;
  border: 0; background: transparent; color: var(--ink); font: 600 .78rem var(--font-body); cursor: pointer; border-radius: 10px;
}
.tool svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--surface); }
.tool:focus-visible, .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tool .badge { font: 600 .65rem var(--font-body); padding: 1px 6px; border-radius: 999px; background: var(--line); color: var(--muted); }
.tool[aria-pressed="true"] { color: var(--accent); }
.tool[aria-pressed="true"] .badge { background: var(--accent); color: var(--accent-ink); }

.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.key {
  border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 10px;
  font-family: var(--font-digit); font-size: clamp(1.2rem, 5.4vw, 1.6rem); font-weight: 400;
  padding: 6px 0 3px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.key small { font-size: .6rem; color: var(--muted); font-family: var(--font-body); }
.key:active { background: var(--accent-soft); }
.key.done { color: var(--hint); background: color-mix(in srgb, var(--hint) 12%, var(--surface)); border-color: color-mix(in srgb, var(--hint) 35%, var(--line)); cursor: default; justify-content: center; pointer-events: none; }
.key.done svg { width: 1.35em; height: 1.35em; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

.btn-primary { border: 0; background: var(--accent); color: var(--accent-ink); font: 600 .95rem var(--font-body); padding: 10px 22px; border-radius: 999px; cursor: pointer; }
.help { font-size: .78rem; color: var(--muted); text-align: center; line-height: 1.6; margin: 0; }
.help kbd { font-family: var(--font-digit); font-size: .72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }
.help { display: none; }
@media (hover: hover) and (pointer: fine) { .help { display: block; } }
/* 시작 화면 머리: 제목 + 기록 버튼 */
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.statsbtn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 .88rem var(--font-body); padding: 8px 14px; border-radius: 999px; cursor: pointer;
}
.statsbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.statsbtn:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 기록 화면 */
.stats { max-width: 480px; margin: 0 auto; padding-block: 8px 32px; display: flex; flex-direction: column; gap: 22px; }
.stats h3 { margin: 0 0 10px; font-size: .75rem; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
.result-hero { border: 1px solid var(--line); border-radius: 18px; padding: 20px; background: var(--surface); display: flex; flex-direction: column; gap: 14px; }
.result-hero .eyebrow { margin: 0; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; font-weight: 600; }
.result-hero h2 { margin: 0; font: 800 2rem var(--font-display); letter-spacing: -0.02em; }
.result-hero.win h2 { color: var(--hint); }
.result-hero.fail h2 { color: var(--error); }
.res-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.res-badges:empty { display: none; }
.badge-pill { font: 600 .78rem var(--font-body); padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.badge-pill.gold { background: color-mix(in srgb, #E0A800 18%, var(--surface)); color: color-mix(in srgb, #B07F00 85%, var(--ink)); }
.res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.res-grid div { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.res-grid dt { font-size: .72rem; color: var(--muted); margin-bottom: 2px; }
.res-grid dd { margin: 0; font: 400 1.2rem var(--font-digit); font-variant-numeric: tabular-nums; }
.res-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.res-actions button { flex: 1 1 140px; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chip {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); font: 600 .82rem var(--font-body); cursor: pointer; white-space: nowrap;
}
.chip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .pips { height: 9px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kpi { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--surface); }
.kpi span { display: block; font-size: .75rem; color: var(--muted); }
.kpi b { display: block; font: 400 1.45rem var(--font-digit); font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi small { font-size: .72rem; color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.lv-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.lv-table th { font-size: .72rem; font-weight: 600; color: var(--muted); text-align: right; padding: 10px 12px 8px; white-space: nowrap; }
.lv-table th:first-child, .lv-table td:first-child { text-align: left; }
.lv-table td { padding: 9px 12px; border-top: 1px solid var(--grid-thin); text-align: right; font-family: var(--font-digit); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lv-table td:first-child { font-family: var(--font-body); font-weight: 600; }
.recent { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.recent li { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--grid-thin); font-size: .85rem; }
.recent li:first-child { border-top: 0; }
.recent .when { color: var(--muted); font: 400 .78rem var(--font-digit); font-variant-numeric: tabular-nums; }
.recent .lv { font-weight: 600; }
.recent .t { font-family: var(--font-digit); font-variant-numeric: tabular-nums; }
.pill { font: 600 .72rem var(--font-body); padding: 2px 8px; border-radius: 999px; }
.pill.win { background: color-mix(in srgb, var(--hint) 15%, var(--surface)); color: var(--hint); }
.pill.fail { background: var(--error-soft); color: var(--error); }
.empty { margin: 0; padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; line-height: 1.6; }
.ver { font: 400 .7rem var(--font-digit); color: var(--muted); text-align: center; margin: 0; opacity: .7; }
/* ---------- 색 입히기: 난이도마다 고유색(--lv). 쉬운 단계는 시원한 색, 어려운 단계는 뜨거운 색 ---------- */
.home-sub { margin: -6px 0 6px; color: var(--muted); font-size: .9rem; }
.home-sub b { color: var(--ink); font-weight: 700; }
.continue {
  --c: var(--lv, var(--accent));
  background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 62%, #0B1020));
  color: #fff; padding: 18px 20px; border-radius: 18px;
  box-shadow: 0 10px 24px color-mix(in srgb, var(--c) 30%, transparent);
}
.continue small { opacity: .9; }
.lv-row { grid-template-columns: 42px 1fr auto 18px; border-radius: 16px; padding: 11px 14px 11px 11px; }
.lv-row:hover { border-color: var(--lv); }
.lv-row:active { background: color-mix(in srgb, var(--lv) 8%, var(--surface)); }
.lv-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--lv) 14%, var(--surface)); color: var(--lv); }
.lv-ico .pips { height: 16px; }
.lv-name small { color: var(--lv); font-weight: 600; }
.lvl-chip { background: var(--lv, var(--ink)); color: #fff; box-shadow: 0 4px 12px color-mix(in srgb, var(--lv, var(--ink)) 30%, transparent); }
.lvl-chip .pips i { opacity: .4; }

<script>
/* 문제 생성기와 기법 기반 난이도 판정기. Web Worker 에도 같은 소스를 넘긴다. */
function SudokuGenFactory() {
  const ROW = [], COL = [], BOX = [];
  for (let i = 0; i < 81; i++) { ROW.push(Math.floor(i / 9)); COL.push(i % 9); BOX.push(Math.floor(i / 27) * 3 + Math.floor((i % 9) / 3)); }
  const ROWS = [], COLS = [], BOXES = [];
  for (let k = 0; k < 9; k++) { ROWS.push([]); COLS.push([]); BOXES.push([]); }
  for (let i = 0; i < 81; i++) { ROWS[ROW[i]].push(i); COLS[COL[i]].push(i); BOXES[BOX[i]].push(i); }
  const UNITS = ROWS.concat(COLS, BOXES);
  const IS_PEER = new Uint8Array(81 * 81);
  const PEERS = [];
  for (let i = 0; i < 81; i++) {
    const s = [];
    for (let j = 0; j < 81; j++) if (i !== j && (ROW[i] === ROW[j] || COL[i] === COL[j] || BOX[i] === BOX[j])) { s.push(j); IS_PEER[i * 81 + j] = 1; }
    PEERS.push(s);
  }
  const POP = new Uint8Array(1024);
  for (let m = 1; m < 1024; m++) POP[m] = POP[m >> 1] + (m & 1);
  const lowDigit = m => 31 - Math.clz32(m & -m);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

  // 백트래킹: limit 개까지 해의 수를 센다. fill 이면 첫 해를 g 에 남긴다.
  function solve(g, limit, randomize, fill) {
    const R = new Uint16Array(9), C = new Uint16Array(9), B = new Uint16Array(9);
    for (let i = 0; i < 81; i++) {
      const v = g[i]; if (!v) continue;
      const bit = 1 << v;
      if ((R[ROW[i]] | C[COL[i]] | B[BOX[i]]) & bit) return 0;
      R[ROW[i]] |= bit; C[COL[i]] |= bit; B[BOX[i]] |= bit;
    }
    let count = 0;
    const rec = () => {
      let best = -1, bestMask = 0, bestCnt = 10;
      for (let i = 0; i < 81; i++) {
        if (g[i]) continue;
        const m = ~(R[ROW[i]] | C[COL[i]] | B[BOX[i]]) & 0x3FE;
        const n = POP[m];
        if (n === 0) return false;
        if (n < bestCnt) { best = i; bestMask = m; bestCnt = n; if (n === 1) break; }
      }
      if (best < 0) { count++; return fill || count >= limit; }
      const r = ROW[best], c = COL[best], b = BOX[best];
      const digits = []; for (let d = 1; d <= 9; d++) if (bestMask & (1 << d)) digits.push(d);
      if (randomize) shuffle(digits);
      for (const d of digits) {
        const bit = 1 << d;
        g[best] = d; R[r] |= bit; C[c] |= bit; B[b] |= bit;
        if (rec()) { if (!fill) g[best] = 0; return true; }
        g[best] = 0; R[r] &= ~bit; C[c] &= ~bit; B[b] &= ~bit;
      }
      return false;
    };
    rec();
    return count;
  }

  function combos(arr, k, fn) {
    const pick = [];
    const rec = start => {
      if (pick.length === k) return fn(pick);
      for (let i = start; i <= arr.length - (k - pick.length); i++) {
        pick.push(arr[i]);
        if (rec(i + 1)) return true;
        pick.pop();
      }
      return false;
    };
    return rec(0);
  }

  // 사람이 쓰는 기법 순서대로 풀어 보고, 필요했던 가장 어려운 기법 단계를 반환한다.
  // 1: 싱글 · 2: 교차·페어 · 3: 트리플·X-Wing · 4: 쿼드·Swordfish·XY-Wing · 5: 기법으로 풀리지 않음
  function grade(puzzle) {
    const v = Array.from(puzzle);
    const cand = new Uint16Array(81);
    let left = 0;
    for (let i = 0; i < 81; i++) if (!v[i]) { cand[i] = 0x3FE; left++; }
    for (let i = 0; i < 81; i++) if (v[i]) for (const p of PEERS[i]) cand[p] &= ~(1 << v[i]);

    const place = (i, d) => { v[i] = d; cand[i] = 0; left--; for (const p of PEERS[i]) cand[p] &= ~(1 << d); };
    const elim = (i, mask) => { if (!v[i] && (cand[i] & mask)) { cand[i] &= ~mask; return true; } return false; };

    function singles() {
      for (let i = 0; i < 81; i++) if (!v[i] && POP[cand[i]] === 1) { place(i, lowDigit(cand[i])); return true; }
      for (const u of UNITS) {
        for (let d = 1; d <= 9; d++) {
          const bit = 1 << d; let pos = -1, n = 0, placed = false;
          for (const i of u) { if (v[i] === d) { placed = true; break; } if (cand[i] & bit) { pos = i; n++; } }
          if (!placed && n === 1) { place(pos, d); return true; }
        }
      }
      return false;
    }

    function locked() {
      for (let b = 0; b < 9; b++) {
        for (let d = 1; d <= 9; d++) {
          const bit = 1 << d; let rows = 0, cols = 0, n = 0;
          for (const i of BOXES[b]) if (cand[i] & bit) { rows |= 1 << ROW[i]; cols |= 1 << COL[i]; n++; }
          if (n < 2) continue;
          let ch = false;
          if (POP[rows] === 1) { const r = lowDigit(rows); for (const i of ROWS[r]) if (BOX[i] !== b) ch = elim(i, bit) || ch; }
          if (POP[cols] === 1) { const c = lowDigit(cols); for (const i of COLS[c]) if (BOX[i] !== b) ch = elim(i, bit) || ch; }
          if (ch) return true;
        }
      }
      for (const lines of [ROWS, COLS]) {
        for (const line of lines) {
          for (let d = 1; d <= 9; d++) {
            const bit = 1 << d; let boxes = 0, n = 0;
            for (const i of line) if (cand[i] & bit) { boxes |= 1 << BOX[i]; n++; }
            if (n < 2 || POP[boxes] !== 1) continue;
            const b = lowDigit(boxes); let ch = false;
            for (const i of BOXES[b]) if (!line.includes(i)) ch = elim(i, bit) || ch;
            if (ch) return true;
          }
        }
      }
      return false;
    }

    function nakedSubset(k) {
      for (const u of UNITS) {
        const open = u.filter(i => !v[i] && POP[cand[i]] >= 2 && POP[cand[i]] <= k);
        if (open.length < k) continue;
        const hit = combos(open, k, pick => {
          let union = 0; for (const i of pick) union |= cand[i];
          if (POP[union] !== k) return false;
          let ch = false;
          for (const i of u) if (!pick.includes(i)) ch = elim(i, union) || ch;
          return ch;
        });
        if (hit) return true;
      }
      return false;
    }

    function hiddenSubset(k) {
      for (const u of UNITS) {
        const ds = [], posOf = {};
        for (let d = 1; d <= 9; d++) {
          const bit = 1 << d; let pos = 0, placed = false;
          for (let j = 0; j < 9; j++) { const i = u[j]; if (v[i] === d) { placed = true; break; } if (cand[i] & bit) pos |= 1 << j; }
          if (!placed && POP[pos] >= 2 && POP[pos] <= k) { ds.push(d); posOf[d] = pos; }
        }
        if (ds.length < k) continue;
        const hit = combos(ds, k, pick => {
          let pos = 0, dm = 0; for (const d of pick) { pos |= posOf[d]; dm |= 1 << d; }
          if (POP[pos] !== k) return false;
          let ch = false;
          for (let j = 0; j < 9; j++) if (pos & (1 << j)) ch = elim(u[j], 0x3FE & ~dm) || ch;
          return ch;
        });
        if (hit) return true;
      }
      return false;
    }

    function fish(k) {
      for (let d = 1; d <= 9; d++) {
        const bit = 1 << d;
        for (const [base, cover] of [[ROWS, COLS], [COLS, ROWS]]) {
          const lines = [], posOf = [];
          for (let l = 0; l < 9; l++) {
            let pos = 0; for (let j = 0; j < 9; j++) if (cand[base[l][j]] & bit) pos |= 1 << j;
            if (POP[pos] >= 2 && POP[pos] <= k) { lines.push(l); posOf[l] = pos; }
          }
          if (lines.length < k) continue;
          const hit = combos(lines, k, pick => {
            let pos = 0; for (const l of pick) pos |= posOf[l];
            if (POP[pos] !== k) return false;
            let ch = false;
            for (let j = 0; j < 9; j++) {
              if (!(pos & (1 << j))) continue;
              for (let l = 0; l < 9; l++) if (!pick.includes(l)) ch = elim(cover[j][l], bit) || ch;
            }
            return ch;
          });
          if (hit) return true;
        }
      }
      return false;
    }

    function xyWing() {
      for (let p = 0; p < 81; p++) {
        if (v[p] || POP[cand[p]] !== 2) continue;
        const pm = cand[p];
        const wings = PEERS[p].filter(i => !v[i] && POP[cand[i]] === 2 && cand[i] !== pm && POP[cand[i] & pm] === 1);
        for (const a of wings) {
          const z = cand[a] & ~pm, y = pm & ~cand[a];
          for (const b of wings) {
            if (b === a || cand[b] !== (y | z)) continue;
            let ch = false;
            for (const i of PEERS[a]) if (i !== b && i !== p && IS_PEER[i * 81 + b]) ch = elim(i, z) || ch;
            if (ch) return true;
          }
        }
      }
      return false;
    }

    let max = 1;
    while (left > 0) {
      if (singles()) continue;
      if (locked() || nakedSubset(2) || hiddenSubset(2)) { if (max < 2) max = 2; continue; }
      if (nakedSubset(3) || hiddenSubset(3) || fish(2)) { if (max < 3) max = 3; continue; }
      if (nakedSubset(4) || hiddenSubset(4) || fish(3) || xyWing()) { if (max < 4) max = 4; continue; }
      return 5;
    }
    return max;
  }

  // cfg: { tech: 목표 기법 단계, givens: 남길 숫자 수 상한(없으면 최대한 지움) }
  function generate(cfg, budgetMs) {
    const t0 = Date.now();
    let best = null, tries = 0;
    do {
      tries++;
      const solution = new Array(81).fill(0);
      solve(solution, 1, true, true);
      const p = solution.slice();
      let givens = 81;
      for (const i of shuffle([...Array(81).keys()])) {
        if (cfg.givens && givens <= cfg.givens) break;
        const keep = p[i]; p[i] = 0;
        if (solve(p.slice(), 2, false, false) !== 1 || (cfg.tech < 5 && grade(p) > cfg.tech)) { p[i] = keep; continue; }
        givens--;
      }
      const tech = grade(p);
      const res = { puzzle: p, solution, tech, givens, tries };
      if (tech === cfg.tech) return res;
      if (!best || Math.abs(tech - cfg.tech) < Math.abs(best.tech - cfg.tech)) best = res;
    } while (Date.now() - t0 < budgetMs);
    best.tries = tries;
    return best;
  }

  return { generate, grade };
}
</script>

<script>
(() => {
  // tech: 풀 때 필요한 가장 어려운 기법 단계 (판정기 기준), givens: 처음 보이는 숫자 수 (없으면 정답이 하나로 유지되는 한 최대한 지움)
  const LEVELS = [
    { label: '입문', tech: 1, givens: 46 },
    { label: '쉬움', tech: 1, givens: 38 },
    { label: '보통', tech: 1, givens: 30 },
    { label: '어려움', tech: 2 },   // 교차(박스·줄), 숫자 짝
    { label: '전문가', tech: 3 },   // 세 칸 묶음, X-Wing
    { label: '마스터', tech: 4 },   // 네 칸 묶음, Swordfish, XY-Wing
    { label: '극한', tech: 5 },     // 위 기법으로 풀리지 않음
  ];
  // 난이도 색: 입문 초록 → 쉬움 청록 → 보통 파랑 → 어려움 보라 → 전문가 자주 → 마스터 분홍 → 극한 주황빨강
  const LV_COLORS = ['#1FA36B', '#13A0B5', '#2F6FE0', '#6A4EE0', '#A944D0', '#E0478A', '#E8582E'];
  const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>';
  const CHEVRON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  const HINTS = 5;
  const MAX_MISTAKES = 3;  // 이 횟수만큼 틀리면 실패
  const KEY = 'classic-sudoku-v1';
  const STATS_KEY = 'classic-sudoku-stats';
  const Gen = SudokuGenFactory();
  let worker = null;
  try {
    const src = 'const G = (' + SudokuGenFactory.toString() + ')();\nonmessage = e => postMessage(G.generate(e.data.cfg, e.data.budget));';
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  } catch (e) { worker = null; }
  const cfgOf = level => ({ tech: LEVELS[level].tech, givens: LEVELS[level].givens || 0 });
  function generateAsync(level) {
    const msg = { cfg: cfgOf(level), budget: 5000 };
    const local = () => Gen.generate(msg.cfg, msg.budget);
    if (!worker) return new Promise(res => setTimeout(() => res(local()), 30));
    return new Promise(res => {
      const w = worker;
      const done = () => { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); };
      const onMsg = e => { done(); res(e.data); };
      const onErr = () => { done(); worker = null; res(local()); };
      w.addEventListener('message', onMsg); w.addEventListener('error', onErr);
      w.postMessage(msg);
    });
  }

  // 각 칸의 같은 행·열·박스 칸 목록
  const PEERS = [];
  for (let i = 0; i < 81; i++) {
    const r = Math.floor(i / 9), c = i % 9, br = r - r % 3, bc = c - c % 3, s = new Set();
    for (let k = 0; k < 9; k++) { s.add(r * 9 + k); s.add(k * 9 + c); s.add((br + Math.floor(k / 3)) * 9 + bc + k % 3); }
    s.delete(i); PEERS.push([...s]);
  }

  // 상태 (저장된 게임이 없으면 null)
  let S = null;
  const fresh = (level, gen) => {
    const { puzzle, solution } = gen;
    return { level, tech: gen.tech, puzzle, solution, values: puzzle.slice(), notes: new Array(81).fill(0), hinted: new Array(81).fill(false),
      mistakes: 0, seconds: 0, hintsLeft: HINTS, hintsMax: HINTS, done: false, failed: false, paused: false, sel: puzzle.indexOf(0), history: [] };
  };
  const blank = level => fresh(level, { puzzle: new Array(81).fill(0), solution: new Array(81).fill(0), tech: 0 });
  const save = () => { if (!S || busy) return; try { const { history, ...rest } = S; localStorage.setItem(KEY, JSON.stringify(rest)); } catch (e) {} };
  const load = () => {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (!s || !s.puzzle || s.puzzle.length !== 81 || !s.solution.some(Boolean)) return null;
      if (typeof s.level !== 'number') s.level = { easy: 1, medium: 2, hard: 3 }[s.diff] ?? 2; // 3단계 시절 저장본
      if (!s.done && !s.failed && s.mistakes >= MAX_MISTAKES) s.mistakes = MAX_MISTAKES - 1; // 실수 제한 도입 전 저장본은 한 번의 기회를 남긴다
      if (s.hintsMax == null) s.hintsMax = 3; // 힌트 3개 시절 저장본
      return { ...s, history: [] };
    } catch (e) { return null; }
  };
  // 게임 기록: 끝난 게임마다 { t: 끝난 시각, l: 난이도, r: 'win'|'fail', s: 초, m: 실수, h: 힌트 } 한 줄
  const HISTORY_KEY = 'classic-sudoku-history';
  const loadHistory = () => { try { const a = JSON.parse(localStorage.getItem(HISTORY_KEY)); if (Array.isArray(a)) return a; } catch (e) {} return []; };
  const saveHistory = a => { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(a.slice(-1000))); } catch (e) {} };
  // 기록 화면 도입 전(버전 7 이하)의 최고 기록
  const legacyBest = () => { try { const t = JSON.parse(localStorage.getItem(STATS_KEY)); if (t && t.best) return t.best; } catch (e) {} return {}; };
  function levelStats(hist, l) {
    const plays = hist.filter(g => g.l === l), wins = plays.filter(g => g.r === 'win');
    const lb = legacyBest()[l];
    const bestH = wins.length ? Math.min(...wins.map(g => g.s)) : null;
    const best = bestH == null ? (lb ?? null) : (lb != null ? Math.min(lb, bestH) : bestH);
    const avg = wins.length ? Math.round(wins.reduce((a, g) => a + g.s, 0) / wins.length) : null;
    const avgM = plays.length ? plays.reduce((a, g) => a + g.m, 0) / plays.length : null;
    return { tries: plays.length, wins: wins.length, best, avg, avgM };
  }
  let noteMode = false;
  let busy = false, busyLevel = 0;
  let screen = 'home';
  let lastResult = null; // 방금 끝난 게임 (기록 화면 맨 위에 표시)

  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  const pipsHtml = idx => { let h = ''; for (let k = 0; k < 7; k++) h += '<i class="' + (k <= idx ? 'on' : '') + '" style="height:' + (40 + k * 10) + '%"></i>'; return h; };
  const $ = id => document.getElementById(id);

  // 시작 화면: 난이도 목록
  const levelRows = LEVELS.map((lv, idx) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lv-row'; b.id = 'lv-' + idx;
    b.style.setProperty('--lv', LV_COLORS[idx]);
    b.innerHTML = '<span class="lv-ico" aria-hidden="true"><span class="pips">' + pipsHtml(idx) + '</span></span>' +
      '<span class="lv-name"><b>' + lv.label + '</b><small>' + (idx + 1) + '단계</small></span>' +
      '<span class="lv-best" id="best-' + idx + '"></span>' + CHEVRON_SVG;
    b.addEventListener('click', () => chooseLevel(idx));
    $('levelList').appendChild(b);
    return b;
  });

  const over = () => S.done || !!S.failed;
  const hintsUsed = () => (S.hintsMax ?? 3) - S.hintsLeft;
  const mistakeText = () => S.mistakes + '/' + MAX_MISTAKES;
  const hasGame = () => !!S && !over() && !busy && S.solution.some(Boolean);
  const inProgress = () => hasGame() && (S.seconds > 0 || S.values.some((v, i) => v && S.puzzle[i] === 0));

  function renderHome() {
    const cont = $('continueBtn');
    cont.hidden = !inProgress();
    if (!cont.hidden) cont.style.setProperty('--lv', LV_COLORS[S.level]);
    // 제목 아래 한 줄 요약: 오늘 완성 수 · 연속 완성
    const h0 = loadHistory(), today = new Date().toDateString();
    const todayWins = h0.filter(g => g.r === 'win' && new Date(g.t).toDateString() === today).length;
    let run = 0; for (let k = h0.length - 1; k >= 0 && h0[k].r === 'win'; k--) run++;
    $('homeSub').innerHTML = h0.length
      ? '오늘 <b>' + todayWins + '판</b> 완성' + (run >= 2 ? ' · 연속 완성 <b>' + run + '판</b>' : '')
      : '7단계 난이도 · 매판 새로 만든 문제';
    if (!cont.hidden) $('continueMeta').textContent = LEVELS[S.level].label + ' · ' + fmt(S.seconds) + ' · 실수 ' + mistakeText();
    const hist = loadHistory();
    LEVELS.forEach((lv, idx) => {
      const ls = levelStats(hist, idx), best = ls.best, n = ls.wins;
      $('best-' + idx).innerHTML = best != null ? '최고 기록<b>' + fmt(best) + '</b>' : '';
      levelRows[idx].setAttribute('aria-label', (idx + 1) + '단계 ' + lv.label + (best != null ? ', 최고 기록 ' + fmt(best) + ', ' + n + '판 완성' : ''));
    });
  }

  // 화면 전환: 게임 화면은 주소 끝에 #play 를 붙여 폰의 뒤로가기로 목록에 돌아오게 한다
  // 주소: #play 게임, #result 방금 끝난 게임의 기록, #stats 목록에서 연 기록
  function showScreen(name, push = true) {
    screen = name;
    $('home').hidden = name !== 'home';
    $('game').hidden = name !== 'game';
    $('stats').hidden = name !== 'stats';
    if (name === 'game') {
      if (push && location.hash !== '#play') {
        // 기록 화면에서 바로 다음 게임으로 가면 기록 화면 자리를 게임으로 바꿔, 뒤로가기가 목록으로 오게 한다
        if (location.hash === '#result' || location.hash === '#stats') history.replaceState(null, '', '#play');
        else history.pushState(null, '', '#play');
      }
      render(); fitBoard();
    } else if (name === 'stats') {
      renderStats(location.hash === '#result' && !!lastResult);
    } else {
      $('confirm').hidden = true; pendingLevel = null;
      renderHome();
    }
    window.scrollTo(0, 0);
  }
  function goHome() {
    if (location.hash) history.back();
    else showScreen('home', false);
  }
  window.addEventListener('popstate', () => {
    const h = location.hash;
    showScreen(h === '#play' && S ? 'game' : (h === '#stats' || h === '#result') ? 'stats' : 'home', false);
  });

  // 게임 화면 구성
  const board = $('board');
  const cells = [];
  for (let i = 0; i < 81; i++) {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'cell-' + i;
    b.className = 'cell c' + (i % 9) + ' r' + Math.floor(i / 9);
    b.setAttribute('role', 'gridcell');
    b.addEventListener('click', () => { if (!S || busy) return; S.sel = i; render(); });
    board.appendChild(b); cells.push(b);
  }
  const keys = [];
  for (let d = 1; d <= 9; d++) {
    const k = document.createElement('button');
    k.type = 'button'; k.className = 'key'; k.id = 'key-' + d;
    k.addEventListener('click', () => input(d));
    $('pad').appendChild(k); keys.push(k);
  }

  // 판 크기 = min(묶음 너비, 묶음 높이 - 상태줄·숫자 패드·도구 줄 높이)
  const playEl = $('play'), wrapEl = document.querySelector('.board-wrap');
  function fitBoard() {
    if ($('game').hidden) return;
    const gap = parseFloat(getComputedStyle(playEl).rowGap) || 0;
    const others = [...playEl.children].filter(el => el !== wrapEl).reduce((h, el) => h + el.offsetHeight, 0);
    const avail = playEl.clientHeight - others - gap * (playEl.children.length - 1);
    const size = Math.floor(Math.max(180, Math.min(playEl.clientWidth, avail)));
    wrapEl.style.width = wrapEl.style.height = size + 'px';
  }
  if (window.ResizeObserver) new ResizeObserver(fitBoard).observe(playEl);
  window.addEventListener('resize', fitBoard);

  function render() {
    if (!S) return;
    const sel = S.sel, selVal = sel >= 0 ? S.values[sel] : 0;
    const peerSet = new Set(sel >= 0 ? PEERS[sel] : []);
    for (let i = 0; i < 81; i++) {
      const el = cells[i], v = S.values[i], given = S.puzzle[i] !== 0;
      const err = v && !given && v !== S.solution[i];
      el.classList.toggle('given', given);
      el.classList.toggle('entered', !given && !!v && !S.hinted[i]);
      el.classList.toggle('hinted', !given && !!v && S.hinted[i]);
      el.classList.toggle('err', !!err);
      const hs = !!HS && !busy;
      el.classList.toggle('sel', i === sel && !busy && !hs);
      el.classList.toggle('same', !hs && i !== sel && !!selVal && v === selVal);
      el.classList.toggle('peer', !hs && i !== sel && !busy && peerSet.has(i) && !(selVal && v === selVal));
      el.classList.toggle('h-unit', hs && HS.unitSet.has(i));
      el.classList.toggle('h-target', hs && i === HS.h.cell);
      el.classList.toggle('h-why', hs && HS.step >= 2 && HS.whySet.has(i));
      if (v) { el.textContent = v; }
      else if (S.notes[i]) {
        let h = '<span class="notes">';
        for (let d = 1; d <= 9; d++) h += '<span' + (selVal === d ? ' class="hl"' : '') + '>' + ((S.notes[i] >> d) & 1 ? d : '') + '</span>';
        el.innerHTML = h + '</span>';
      } else el.textContent = '';
      const r = Math.floor(i / 9) + 1, c = i % 9 + 1;
      el.setAttribute('aria-label', r + '행 ' + c + '열 ' + (v ? v : '빈 칸'));
    }
    const counts = new Array(10).fill(0);
    S.values.forEach((v, i) => { if (v && v === S.solution[i]) counts[v]++; });
    keys.forEach((k, idx) => {
      const d = idx + 1, left = 9 - counts[d], full = left === 0;
      const html = full ? CHECK_SVG : d + '<small>' + left + '</small>';
      if (k.dataset.html !== html) { k.innerHTML = html; k.dataset.html = html; }
      k.classList.toggle('done', full);
      k.disabled = full;
      k.setAttribute('aria-label', full ? d + ' 완성' : d + ' 입력, ' + left + '개 남음');
    });
    const shown = busy ? busyLevel : S.level;
    $('lvlName').textContent = LEVELS[shown].label;
    $('game').style.setProperty('--lv', LV_COLORS[shown]);
    $('lvlPips').innerHTML = pipsHtml(shown);
    const showPause = !!S.paused && !over() && !busy;
    document.querySelector('.board-wrap').classList.toggle('is-paused', showPause);
    $('pausedBox').hidden = !showPause;
    if (showPause) $('pausedText').textContent = LEVELS[S.level].label + ' · ' + fmt(S.seconds);
    $('pauseBtn').hidden = over();
    $('mistakes').textContent = mistakeText();
    $('mistakes').classList.toggle('warn', S.mistakes >= MAX_MISTAKES - 1);
    $('time').textContent = fmt(S.seconds);
    $('hintBadge').textContent = S.hintsLeft;
    renderHint();
    $('noteBtn').setAttribute('aria-pressed', noteMode);
    $('noteBadge').textContent = noteMode ? 'ON' : 'OFF';
    $('busy').hidden = !busy;
    if (busy) $('busyText').textContent = LEVELS[busyLevel].label + ' 문제를 만드는 중이에요';
    $('win').hidden = !S.done || busy;
    $('fail').hidden = !S.failed || busy;
    if (S.failed) $('failText').textContent = '실수 ' + mistakeText() + ' · ' + LEVELS[S.level].label + ' · ' + fmt(S.seconds);
    if (S.done) $('winText').textContent = (lastResult && lastResult.best ? '최고 기록 · ' : '') +
      LEVELS[S.level].label + ' · ' + fmt(S.seconds) + ' · 실수 ' + mistakeText() + ' · 힌트 ' + hintsUsed() + '회';
  }

  const snapshot = () => { S.history.push({ values: S.values.slice(), notes: S.notes.slice(), hinted: S.hinted.slice() }); if (S.history.length > 200) S.history.shift(); };
  const editable = i => !!S && !busy && !S.paused && i >= 0 && !over() && S.puzzle[i] === 0 && !S.hinted[i];

  // 게임이 끝나면 기록에 한 줄 추가하고, 완성된 판을 잠깐 보여 준 뒤 기록 화면으로 넘어간다
  function endGame(result) {
    if (S.recorded) return;
    S.recorded = true;
    const hist = loadHistory(), before = levelStats(hist, S.level);
    const g = { t: Date.now(), l: S.level, r: result, s: S.seconds, m: S.mistakes, h: hintsUsed() };
    hist.push(g); saveHistory(hist);
    lastResult = { ...g, best: result === 'win' && (before.best == null || g.s < before.best), prevAvg: before.avg, firstWin: result === 'win' && before.wins === 0 };
    setTimeout(() => {
      if (screen !== 'game' || !S || !S.recorded) return;
      history.replaceState(null, '', '#result');
      showScreen('stats', false);
    }, 1100);
  }
  function place(i, d) {
    S.values[i] = d; S.notes[i] = 0;
    if (d === S.solution[i]) PEERS[i].forEach(p => { S.notes[p] &= ~(1 << d); });
    else { S.mistakes++; if (S.mistakes >= MAX_MISTAKES) { S.failed = true; endGame('fail'); return; } }
    if (S.values.every((v, k) => v === S.solution[k])) { S.done = true; endGame('win'); }
  }

  const isComplete = d => S.values.filter((v, k) => v === d && v === S.solution[k]).length >= 9;
  function input(d) {
    const i = S ? S.sel : -1; if (!editable(i)) return;
    closeHint();
    if (isComplete(d)) return; // 9개를 모두 맞게 채운 숫자는 입력·메모 모두 막는다
    if (noteMode) {
      if (S.values[i]) return;
      snapshot(); S.notes[i] ^= (1 << d);
    } else {
      if (S.values[i] === d) return;
      snapshot(); place(i, d);
    }
    save(); render();
  }
  function erase() {
    const i = S ? S.sel : -1; if (!editable(i) || (!S.values[i] && !S.notes[i])) return;
    closeHint();
    snapshot(); S.values[i] = 0; S.notes[i] = 0; save(); render();
  }
  function undo() {
    if (!S || over() || busy || S.paused) return;
    const h = S.history.pop(); if (!h) return;
    closeHint();
    S.values = h.values; S.notes = h.notes; S.hinted = h.hinted; save(); render();
  }
  // ---------- 단계별 힌트: 위치 → 설명 → 정답 ----------
  const ROWS = [], COLS = [], BOXES = [];
  for (let k = 0; k < 9; k++) { ROWS.push([]); COLS.push([]); BOXES.push([]); }
  for (let i = 0; i < 81; i++) { const r = Math.floor(i / 9), c = i % 9; ROWS[r].push(i); COLS[c].push(i); BOXES[Math.floor(r / 3) * 3 + Math.floor(c / 3)].push(i); }
  const BOX_NAMES = ['왼쪽 위', '위 가운데', '오른쪽 위', '왼쪽 가운데', '한가운데', '오른쪽 가운데', '왼쪽 아래', '아래 가운데', '오른쪽 아래'];
  const boxOfCell = i => Math.floor(Math.floor(i / 9) / 3) * 3 + Math.floor((i % 9) / 3);
  const cellName = i => (Math.floor(i / 9) + 1) + '행 ' + (i % 9 + 1) + '열';
  const unitName = (type, k) => type === 'row' ? (k + 1) + '행' : type === 'col' ? (k + 1) + '열' : BOX_NAMES[k] + ' 박스';
  const unitCells = (type, k) => type === 'row' ? ROWS[k] : type === 'col' ? COLS[k] : BOXES[k];
  const ALL_UNITS = [...ROWS.map((u, k) => ['row', k, u]), ...COLS.map((u, k) => ['col', k, u]), ...BOXES.map((u, k) => ['box', k, u])];
  const pc = m => { let n = 0; for (; m; m &= m - 1) n++; return n; };
  const digitsOf = m => { const a = []; for (let d = 1; d <= 9; d++) if (m & (1 << d)) a.push(d); return a; };
  // 숫자 읽기의 받침 여부: 1(일) 3(삼) 6(육) 7(칠) 8(팔)은 받침이 있다
  const hasBatchim = d => [1, 3, 6, 7, 8].includes(d);
  const jo = (d, withB, withoutB) => d + (hasBatchim(d) ? withB : withoutB);
  const B = d => '<b>' + d + '</b>';
  const Bj = (d, withB, withoutB) => '<b>' + d + '</b>' + (hasBatchim(d) ? withB : withoutB);

  // 맞게 채운 숫자만 기준으로 각 칸의 후보 계산 (틀린 숫자는 빈칸으로 본다)
  function hintBoard() {
    const v = S.values.map((x, i) => (x && x === S.solution[i]) ? x : 0);
    const cand = new Array(81).fill(0);
    for (let i = 0; i < 81; i++) {
      if (v[i]) continue;
      let m = 0x3FE; for (const p of PEERS[i]) if (v[p]) m &= ~(1 << v[p]);
      cand[i] = m;
    }
    return { v, cand };
  }

  // 바로 정해지는 칸 찾기: 빈칸 하나 남은 줄 → 자리가 하나뿐인 숫자(박스·행·열) → 후보가 하나뿐인 칸
  function findSingles(v, cand) {
    const K = { full: [], hiddenBox: [], hiddenLine: [], naked: [] };
    for (const [type, k, u] of ALL_UNITS) {
      const empty = u.filter(i => !v[i]);
      if (empty.length === 1) { K.full.push({ kind: 'full', cell: empty[0], d: S.solution[empty[0]], type, k }); continue; }
      for (let d = 1; d <= 9; d++) {
        if (u.some(i => v[i] === d)) continue;
        const pos = empty.filter(i => cand[i] & (1 << d));
        if (pos.length === 1 && S.solution[pos[0]] === d) (type === 'box' ? K.hiddenBox : K.hiddenLine).push({ kind: 'hidden', cell: pos[0], d, type, k });
      }
    }
    for (let i = 0; i < 81; i++) if (!v[i] && pc(cand[i]) === 1) K.naked.push({ kind: 'naked', cell: i, d: S.solution[i] });
    return [K.full, K.hiddenBox, K.hiddenLine, K.naked];
  }
  function pickSingle(lists, prefer) {
    if (prefer >= 0) for (const L of lists) { const h = L.find(x => x.cell === prefer); if (h) return h; }
    for (const L of lists) if (L.length) return L[Math.floor(Math.random() * L.length)];
    return null;
  }

  function combos(arr, k, fn) {
    const pick = [];
    const rec = st => { if (pick.length === k) return fn(pick); for (let i = st; i <= arr.length - (k - pick.length); i++) { pick.push(arr[i]); if (rec(i + 1)) return true; pick.pop(); } return false; };
    return rec(0);
  }
  // 후보 지우기 기법 한 번 적용. 적용했으면 사람이 읽을 설명을 반환
  function eliminateOnce(v, cand) {
    const strip = (cells, mask) => { let ch = false; for (const i of cells) if (!v[i] && (cand[i] & mask)) { cand[i] &= ~mask; ch = true; } return ch; };
    // 교차 1: 박스 안에서 숫자가 한 줄에만 있으면 그 줄의 다른 박스에서 지운다
    for (let b = 0; b < 9; b++) for (let d = 1; d <= 9; d++) {
      const pos = BOXES[b].filter(i => !v[i] && (cand[i] & (1 << d))); if (pos.length < 2) continue;
      const rs = new Set(pos.map(i => Math.floor(i / 9))), cs = new Set(pos.map(i => i % 9));
      if (rs.size === 1) { const r = [...rs][0]; if (strip(ROWS[r].filter(i => boxOfCell(i) !== b), 1 << d)) return { text: BOX_NAMES[b] + ' 박스에서 ' + Bj(d, '은', '는') + ' ' + (r + 1) + '행에만 들어갈 수 있어요. 그래서 ' + (r + 1) + '행의 다른 박스 칸에서는 ' + jo(d, '을', '를') + ' 후보에서 지워요.', name: '교차' }; }
      if (cs.size === 1) { const c = [...cs][0]; if (strip(COLS[c].filter(i => boxOfCell(i) !== b), 1 << d)) return { text: BOX_NAMES[b] + ' 박스에서 ' + Bj(d, '은', '는') + ' ' + (c + 1) + '열에만 들어갈 수 있어요. 그래서 ' + (c + 1) + '열의 다른 박스 칸에서는 ' + jo(d, '을', '를') + ' 후보에서 지워요.', name: '교차' }; }
    }
    // 교차 2: 줄 안에서 숫자가 한 박스에만 있으면 그 박스의 다른 칸에서 지운다
    for (const [type, k, u] of ALL_UNITS) {
      if (type === 'box') continue;
      for (let d = 1; d <= 9; d++) {
        const pos = u.filter(i => !v[i] && (cand[i] & (1 << d))); if (pos.length < 2) continue;
        const bs = new Set(pos.map(boxOfCell)); if (bs.size !== 1) continue;
        const b = [...bs][0];
        if (strip(BOXES[b].filter(i => !u.includes(i)), 1 << d)) return { text: unitName(type, k) + '에서 ' + Bj(d, '은', '는') + ' ' + BOX_NAMES[b] + ' 박스 안에만 들어갈 수 있어요. 그래서 그 박스의 다른 칸에서는 ' + jo(d, '을', '를') + ' 후보에서 지워요.', name: '교차' };
      }
    }
    // 숫자 묶음(짝·셋): n칸에 후보가 같은 n개뿐이면 같은 줄의 다른 칸에서 지운다 / n개 숫자가 n칸에만 있으면 그 칸의 다른 후보를 지운다
    for (const n of [2, 3]) {
      const word = n === 2 ? '두' : '세';
      for (const [type, k, u] of ALL_UNITS) {
        const open = u.filter(i => !v[i] && pc(cand[i]) >= 2 && pc(cand[i]) <= n);
        let found = null;
        if (open.length >= n) combos(open, n, pick => {
          let m = 0; for (const i of pick) m |= cand[i];
          if (pc(m) !== n) return false;
          if (strip(u.filter(i => !pick.includes(i)), m)) { found = { text: unitName(type, k) + '의 ' + word + ' 칸(' + pick.map(cellName).join(', ') + ')에는 ' + digitsOf(m).map(B).join(', ') + '만 들어갈 수 있어요. 그래서 ' + unitName(type, k) + '의 다른 칸에서는 이 숫자들을 후보에서 지워요.', name: '숫자 짝' }; return true; }
          return false;
        });
        if (found) return found;
        const ds = [], posOf = {};
        for (let d = 1; d <= 9; d++) {
          if (u.some(i => v[i] === d)) continue;
          const pos = u.filter(i => !v[i] && (cand[i] & (1 << d)));
          if (pos.length >= 2 && pos.length <= n) { ds.push(d); posOf[d] = pos; }
        }
        if (ds.length >= n) combos(ds, n, pick => {
          const cells = [...new Set(pick.flatMap(d => posOf[d]))];
          if (cells.length !== n) return false;
          let m = 0; for (const d of pick) m |= 1 << d;
          let ch = false; for (const i of cells) if (cand[i] & ~m & 0x3FE) { cand[i] &= m; ch = true; }
          if (ch) { found = { text: unitName(type, k) + '에서 ' + pick.map(B).join(', ') + (hasBatchim(pick[pick.length - 1]) ? '은' : '는') + ' ' + word + ' 칸(' + cells.map(cellName).join(', ') + ')에만 들어갈 수 있어요. 그래서 그 칸들의 다른 후보는 지워요.', name: '숨은 짝' }; return true; }
          return false;
        });
        if (found) return found;
      }
    }
    // X-Wing: 두 행에서 숫자가 같은 두 열에만 있으면 그 두 열의 다른 칸에서 지운다 (열 기준도 같음)
    for (let d = 1; d <= 9; d++) for (const [base, cover, bn, cn] of [[ROWS, COLS, '행', '열'], [COLS, ROWS, '열', '행']]) {
      const lines = [];
      for (let l = 0; l < 9; l++) { const pos = []; base[l].forEach((i, j) => { if (!v[i] && (cand[i] & (1 << d))) pos.push(j); }); if (pos.length === 2) lines.push([l, pos]); }
      for (let a = 0; a < lines.length; a++) for (let b2 = a + 1; b2 < lines.length; b2++) {
        const [l1, p1] = lines[a], [l2, p2] = lines[b2];
        if (p1[0] !== p2[0] || p1[1] !== p2[1]) continue;
        const targets = p1.flatMap(j => cover[j].filter((_, idx) => idx !== l1 && idx !== l2));
        if (strip(targets, 1 << d)) return { text: Bj(d, '은', '는') + ' ' + (l1 + 1) + bn + '과 ' + (l2 + 1) + bn + '에서 각각 ' + (p1[0] + 1) + cn + '·' + (p1[1] + 1) + cn + ' 두 자리에만 들어갈 수 있어요(X-Wing). 그래서 ' + (p1[0] + 1) + cn + '과 ' + (p1[1] + 1) + cn + '의 다른 칸에서는 ' + jo(d, '을', '를') + ' 후보에서 지워요.', name: 'X-Wing' };
      }
    }
    return null;
  }

  // 힌트 하나 만들기: { cell, d, kind, unit[], why[], loc, why텍스트 }
  function buildHint() {
    const prefer = S.sel;
    const wrongs = []; for (let i = 0; i < 81; i++) if (S.values[i] && !S.puzzle[i] && S.values[i] !== S.solution[i]) wrongs.push(i);
    if (wrongs.length) {
      const i = wrongs.includes(prefer) ? prefer : wrongs[0], x = S.values[i], d = S.solution[i];
      const clash = PEERS[i].filter(p => S.values[p] === x);
      let where = '';
      if (clash.length) { const p = clash[0]; where = Math.floor(p / 9) === Math.floor(i / 9) ? '행' : p % 9 === i % 9 ? '열' : '박스'; }
      return { cell: i, d, kind: 'wrong', unit: [], why: clash,
        loc: cellName(i) + ' 칸에 넣은 ' + Bj(x, '을', '를') + ' 다시 확인해 보세요.',
        explain: clash.length
          ? '같은 ' + where + '에 ' + Bj(x, '이', '가') + ' 이미 있어요(강조한 칸). 한 행·열·박스에는 같은 숫자가 두 번 들어갈 수 없어요.'
          : '지금 넣은 ' + Bj(x, '은', '는') + ' 바로 겹치지는 않지만 정답과 달라요. 그대로 두면 나중에 다른 칸이 막히게 돼요.' };
    }
    const { v, cand } = hintBoard();
    let h = pickSingle(findSingles(v, cand), prefer);
    if (h) return describeSingle(h, v, cand, null);
    // 바로 정해지는 칸이 없으면 기법으로 후보를 지워 가며 찾는다
    const steps = [];
    for (let t = 0; t < 60; t++) {
      const st = eliminateOnce(v, cand); if (!st) break;
      steps.push(st);
      h = pickSingle(findSingles(v, cand), prefer);
      if (h) return describeSingle(h, v, cand, steps);
    }
    // 기법으로도 막히면 후보가 가장 적은 칸
    let best = -1; for (let i = 0; i < 81; i++) if (!v[i] && (best < 0 || pc(cand[i]) < pc(cand[best]))) best = i;
    const list = digitsOf(cand[best]);
    return { cell: best, d: S.solution[best], kind: 'guess', unit: PEERS[best].concat(best), why: [],
      loc: cellName(best) + ' 칸은 후보가 ' + list.length + '개(' + list.map(B).join(', ') + ')뿐이에요.',
      explain: '지금은 알려진 패턴만으로는 막히는 단계예요. 이럴 때는 후보가 가장 적은 칸에서 ' + Bj(list[0], '을', '를') + ' 넣었다고 가정하고 계속 풀어 봐요. 어딘가에서 같은 줄에 숫자가 겹치면 그 가정이 틀린 거라 다른 후보가 정답이에요.' };
  }

  function describeSingle(h, v, cand, steps) {
    const i = h.cell, d = h.d;
    let unit = [], why = [], loc = '', explain = '';
    if (h.kind === 'full') {
      unit = unitCells(h.type, h.k);
      loc = unitName(h.type, h.k) + '에 빈칸이 하나만 남았어요.';
      explain = unitName(h.type, h.k) + '에는 1~9 중 ' + Bj(d, '만', '만') + ' 아직 없어요. 그래서 남은 한 칸에 ' + jo(d, '이', '가') + ' 들어가요.';
    } else if (h.kind === 'hidden') {
      unit = unitCells(h.type, h.k);
      const others = unit.filter(c => !v[c] && c !== i);
      // 다른 빈칸마다 그 칸을 막는 숫자 d 하나를 찾아 강조
      for (const c of others) {
        const blocker = PEERS[c].find(p => v[p] === d && !unit.includes(p));
        if (blocker != null && !why.includes(blocker)) why.push(blocker);
      }
      const line = h.type === 'box' ? '같은 행이나 열' : h.type === 'row' ? '같은 열이나 박스' : '같은 행이나 박스';
      loc = unitName(h.type, h.k) + '에서 숫자 ' + Bj(d, '이', '가') + ' 들어갈 자리를 찾아보세요.';
      explain = unitName(h.type, h.k) + '에는 빈칸이 ' + (others.length + 1) + '곳 있어요. 그중 ' + cellName(i) + ' 칸을 뺀 나머지는 ' + line + '에 강조한 ' + Bj(d, '이', '가') + ' 이미 있어서 ' + jo(d, '을', '를') + ' 넣을 수 없어요. 그래서 ' + Bj(d, '이', '가') + ' 들어갈 자리는 이 칸 하나뿐이에요.';
    } else {
      unit = PEERS[i].slice();
      const seen = {};
      for (const p of PEERS[i]) if (v[p] && !seen[v[p]]) { seen[v[p]] = true; why.push(p); }
      const present = Object.keys(seen).map(Number).sort((a, b) => a - b);
      loc = cellName(i) + ' 칸에 들어갈 수 있는 숫자를 세어 보세요. 같은 행·열·박스를 함께 보면 돼요.';
      explain = steps ? '' : '이 칸과 같은 행·열·박스에 ' + present.map(B).join(', ') + (hasBatchim(present[present.length - 1]) ? '이' : '가') + ' 이미 있어요. 1~9 중 남은 숫자는 ' + Bj(d, '', '') + ' 하나뿐이에요.';
    }
    if (steps) {
      // 기법을 거쳐서 정해진 경우: 판 강조는 칸만, 설명은 지운 과정 + 마지막 결론
      why = [];
      const shown = steps.slice(-3);
      const names = [...new Set(steps.map(s => s.name))].join(', ');
      loc = cellName(i) + ' 칸이 다음으로 풀 수 있는 칸이에요. 바로 정해지지는 않아서 후보 숫자를 지워 가며 봐야 해요.';
      explain = '<span>기본 추론만으로는 바로 정해지는 칸이 없어서 ' + names + ' 기법으로 후보를 정리했어요.</span><ol>' +
        (steps.length > shown.length ? '<li>앞의 ' + (steps.length - shown.length) + '단계는 생략했어요.</li>' : '') +
        shown.map(s => '<li>' + s.text + '</li>').join('') + '</ol><span>' +
        (h.kind === 'naked' ? '그러면 이 칸에 남는 후보는 ' + Bj(d, '', '') + ' 하나예요.' : '그러면 ' + unitName(h.type, h.k) + '에서 ' + Bj(d, '이', '가') + ' 들어갈 자리는 이 칸 하나만 남아요.') + '</span>';
    }
    return { cell: i, d, kind: h.kind, unit, why, loc, explain };
  }

  // 힌트 진행 상태 (저장하지 않음)
  let HS = null; // { h, step: 1|2|3, unitSet, whySet }
  function closeHint() { if (!HS) return; HS = null; renderHint(); }
  function hint() {
    if (!S || over() || busy || S.paused) return;
    if (HS) { closeHint(); render(); return; }
    if (S.hintsLeft <= 0) return;
    const h = buildHint(); if (!h) return;
    S.hintsLeft--; save();
    HS = { h, step: 1, unitSet: new Set(h.unit), whySet: new Set(h.why) };
    S.sel = h.cell;
    render();
  }
  function hintNext() {
    if (!HS) return;
    if (HS.step === 1) { HS.step = 2; render(); return; }
    if (HS.step === 2) {
      const { cell: i, d } = HS.h;
      snapshot(); S.hinted[i] = true; S.notes[i] = 0;
      const before = S.mistakes; place(i, d); S.mistakes = before;
      HS.step = 3; save(); render(); return;
    }
    closeHint(); render();
  }
  function renderHint() {
    const open = !!HS && !busy && screen === 'game';
    $('hintPanel').hidden = !open;
    $('pad').hidden = open; document.querySelector('.tools').hidden = open;
    if (open) {
      const { h, step } = HS;
      $('hpStep').textContent = step + '/3 · ' + ['위치', '설명', '정답'][step - 1];
      [...$('hpDots').children].forEach((el, k) => el.classList.toggle('on', k < step));
      $('hpTitle').textContent = step === 1 ? '여기를 보세요' : step === 2 ? '왜 그럴까요' : '정답은 ' + h.d + (hasBatchim(h.d) ? '이에요' : '예요');
      $('hpBody').innerHTML = step === 1 ? h.loc : step === 2 ? h.explain : cellName(h.cell) + ' 칸에 ' + Bj(h.d, '을', '를') + ' 넣었어요.' + (h.kind === 'wrong' ? ' 틀린 숫자를 고쳤어요.' : '');
      $('hpNext').textContent = step === 1 ? '설명 보기' : step === 2 ? '정답 보기' : '닫기';
    }
    fitBoard();
  }

  // 난이도 선택: 진행 중인 게임이 있으면 시작 화면에서 한 번 확인
  let pendingLevel = null;
  function chooseLevel(level) {
    if (busy) return;
    if (inProgress()) {
      pendingLevel = level;
      $('confirmText').textContent = '진행 중인 ' + LEVELS[S.level].label + ' 게임은 사라집니다. ' + LEVELS[level].label + ' 난이도로 새로 시작할까요?';
      $('confirm').hidden = false;
      $('confirmYes').focus();
    } else startNew(level);
  }
  async function startNew(level) {
    if (busy) return;
    $('confirm').hidden = true; pendingLevel = null;
    S = blank(level); HS = null; busy = true; busyLevel = level;
    showScreen('game');
    const gen = await generateAsync(level);
    S = fresh(level, gen); busy = false; save();
    if (screen === 'game') render(); else renderHome();
  }

  // 기록 화면
  const fmtLong = sec => { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? h + '시간 ' + m + '분' : m ? m + '분 ' + (sec % 60) + '초' : sec + '초'; };
  const fmtWhen = t => { const d = new Date(t), p = n => String(n).padStart(2, '0'); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
  const chipBtns = LEVELS.map((lv, idx) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.id = 'chip-' + idx;
    b.style.setProperty('--lv', LV_COLORS[idx]);
    b.innerHTML = '<span class="pips" aria-hidden="true">' + pipsHtml(idx) + '</span>' + lv.label;
    b.setAttribute('aria-label', (idx + 1) + '단계 ' + lv.label + ' 새 게임');
    b.addEventListener('click', () => startNew(idx));
    $('nextLevels').appendChild(b);
    return b;
  });
  function renderStats(withHero) {
    const hist = loadHistory();
    const hero = $('resultHero'), R = withHero ? lastResult : null;
    hero.hidden = !R;
    if (R) {
      const win = R.r === 'win';
      hero.className = 'result-hero ' + (win ? 'win' : 'fail');
      hero.style.setProperty('--lv', LV_COLORS[R.l]);
      $('resPips').innerHTML = pipsHtml(R.l);
      $('resLevel').textContent = (R.l + 1) + '단계 ' + LEVELS[R.l].label;
      $('resTitle').textContent = win ? '완성했어요' : '실패했어요';
      const badges = [];
      if (R.best) badges.push('<span class="badge-pill gold">' + (R.firstWin ? '첫 완성' : '최고 기록') + '</span>');
      if (win && R.prevAvg != null && R.prevAvg !== R.s) badges.push('<span class="badge-pill">평균보다 ' + fmt(Math.abs(R.prevAvg - R.s)) + (R.s < R.prevAvg ? ' 빨라요' : ' 느려요') + '</span>');
      if (win && R.m === 0 && R.h === 0) badges.push('<span class="badge-pill">실수·힌트 없이 완성</span>');
      $('resBadges').innerHTML = badges.join('');
      $('resTime').textContent = fmt(R.s);
      $('resMistakes').textContent = R.m + '/' + MAX_MISTAKES;
      $('resHints').textContent = R.h + '회';
      $('resPrimary').textContent = win ? '한 판 더 · ' + LEVELS[R.l].label : '같은 문제 다시';
      $('resSecondary').hidden = win;
      $('resSecondary').textContent = '새 문제';
    }
    const cur = R ? R.l : (S ? S.level : 2);
    chipBtns.forEach((b, idx) => b.setAttribute('aria-current', idx === cur));
    $('nextTitle').textContent = R ? '다음 게임' : '새 게임';

    const empty = hist.length === 0;
    $('statsEmpty').hidden = !empty;
    $('statsBody').hidden = empty; $('levelSection').hidden = empty; $('recentSection').hidden = empty;
    if (empty) return;

    const wins = hist.filter(g => g.r === 'win');
    $('kPlays').textContent = hist.length + '판';
    $('kPlaysSub').textContent = '완성 ' + wins.length + ' · 실패 ' + (hist.length - wins.length);
    $('kRate').textContent = Math.round(wins.length / hist.length * 100) + '%';
    $('kRateSub').textContent = '평균 실수 ' + (hist.reduce((a, g) => a + g.m, 0) / hist.length).toFixed(1) + '회';
    let streak = 0; for (let k = hist.length - 1; k >= 0 && hist[k].r === 'win'; k--) streak++;
    let bestStreak = 0, run = 0; hist.forEach(g => { run = g.r === 'win' ? run + 1 : 0; if (run > bestStreak) bestStreak = run; });
    $('kStreak').textContent = streak + '판';
    $('kStreakSub').textContent = '최고 ' + bestStreak + '판';
    const total = hist.reduce((a, g) => a + g.s, 0);
    $('kTime').textContent = fmtLong(total);
    $('kTimeSub').textContent = '한 판 평균 ' + fmt(Math.round(total / hist.length));

    $('lvTable').innerHTML = LEVELS.map((lv, idx) => {
      const ls = levelStats(hist, idx);
      if (!ls.tries && ls.best == null) return '';
      const dash = '–';
      return '<tr><td><span class="dot" style="--lv:' + LV_COLORS[idx] + '"></span>' + lv.label + '</td><td>' + (ls.tries ? ls.wins + '/' + ls.tries : dash) + '</td><td>' + (ls.best != null ? fmt(ls.best) : dash) +
        '</td><td>' + (ls.avg != null ? fmt(ls.avg) : dash) + '</td><td>' + (ls.avgM != null ? ls.avgM.toFixed(1) : dash) + '</td></tr>';
    }).join('');

    $('recentList').innerHTML = hist.slice(-10).reverse().map(g =>
      '<li><span class="when">' + fmtWhen(g.t) + '</span><span class="lv"><span class="dot" style="--lv:' + LV_COLORS[g.l] + '"></span>' + LEVELS[g.l].label + '</span>' +
      '<span class="t">' + fmt(g.s) + ' · 실수 ' + g.m + '</span><span class="pill ' + g.r + '">' + (g.r === 'win' ? '완성' : '실패') + '</span></li>'
    ).join('');
  }
  const retrySame = () => {
    S = fresh(S.level, { puzzle: S.puzzle, solution: S.solution, tech: S.tech }); HS = null; noteMode = false; save(); showScreen('game');
  };
  $('statsBtn').addEventListener('click', () => { history.pushState(null, '', '#stats'); showScreen('stats', false); });
  $('statsBack').addEventListener('click', goHome);
  $('resPrimary').addEventListener('click', () => { if (!lastResult) return; if (lastResult.r === 'win') startNew(lastResult.l); else retrySame(); });
  $('resSecondary').addEventListener('click', () => { if (lastResult) startNew(lastResult.l); });

  $('continueBtn').addEventListener('click', () => showScreen('game'));
  $('backBtn').addEventListener('click', goHome);
  $('winNew').addEventListener('click', () => startNew(S.level));
  $('winHome').addEventListener('click', goHome);
  // 실패 후: 같은 문제를 처음 상태로 되돌리거나 새 문제로 시작
  $('failRetry').addEventListener('click', retrySame);
  $('failNew').addEventListener('click', () => startNew(S.level));
  $('failHome').addEventListener('click', goHome);
  $('confirmYes').addEventListener('click', () => { if (pendingLevel != null) startNew(pendingLevel); });
  $('confirmNo').addEventListener('click', () => { $('confirm').hidden = true; pendingLevel = null; });
  // 일시정지: 시간을 멈추고 판을 가린다. 앱을 내리거나 탭을 옮기면 자동으로 일시정지
  function setPaused(p) { if (!S || over() || busy || !!S.paused === p) return; S.paused = p; save(); render(); }
  $('pauseBtn').addEventListener('click', () => setPaused(true));
  $('resumeBtn').addEventListener('click', () => setPaused(false));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && screen === 'game') setPaused(true); });
  $('undoBtn').addEventListener('click', undo);
  $('eraseBtn').addEventListener('click', erase);
  $('hintBtn').addEventListener('click', hint);
  $('hpNext').addEventListener('click', hintNext);
  $('hpClose').addEventListener('click', () => { closeHint(); render(); });
  $('noteBtn').addEventListener('click', () => { noteMode = !noteMode; render(); });

  document.addEventListener('keydown', e => {
    if (screen !== 'game' || !S) return;
    if (e.key === 'Escape' && !S.paused) { if (HS) { closeHint(); render(); } else goHome(); return; }
    if (HS && e.key === 'Enter') { e.preventDefault(); hintNext(); return; }
    if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'p') { setPaused(!S.paused); return; }
    if (S.paused) { if (e.key === 'Escape' || e.key === 'Enter') setPaused(false); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-9]$/.test(e.key)) { input(+e.key); return; }
    if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { erase(); return; }
    if (e.key.toLowerCase() === 'n') { noteMode = !noteMode; render(); return; }
    const mv = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (mv !== undefined) {
      e.preventDefault();
      let i = S.sel < 0 ? 0 : S.sel, r = Math.floor(i / 9), c = i % 9;
      if (mv === -9) r = (r + 8) % 9; if (mv === 9) r = (r + 1) % 9;
      if (mv === -1) c = (c + 8) % 9; if (mv === 1) c = (c + 1) % 9;
      S.sel = r * 9 + c; render(); cells[S.sel].focus();
    }
  });

  // 타이머: 게임 화면이 보일 때만 진행
  setInterval(() => {
    if (screen === 'game' && S && !over() && !busy && !S.paused && document.visibilityState === 'visible') {
      S.seconds++; $('time').textContent = fmt(S.seconds);
      if (S.seconds % 5 === 0) save();
    }
  }, 1000);

  // 시작: 항상 목록부터. 게임 중에 새로고침했다면(#play) 목록 위에 게임 화면을 다시 띄워 뒤로가기가 목록으로 오게 한다
  S = load();
  const startHash = location.hash;
  const resumePlay = startHash === '#play' && hasGame();
  history.replaceState(null, '', location.pathname + location.search);
  showScreen('home', false);
  if (resumePlay) showScreen('game');
  else if (startHash === '#stats' || startHash === '#result') { history.pushState(null, '', '#stats'); showScreen('stats', false); }
})();
</script>
<script>
// 버전: sw.js 의 CACHE, version.json 과 같은 숫자로 함께 올린다
const APP_VERSION = 12;
document.getElementById('ver').textContent = '버전 ' + APP_VERSION;

// 서버의 최신 버전을 확인하고, 더 새로우면 저장된 파일을 지우고 새로 불러온다.
// 홈 화면 앱이 서비스 워커 업데이트를 놓쳐도 이 확인으로 따라잡는다.
async function checkLatest() {
  try {
    const res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
    const latest = (await res.json()).version;
    if (!(latest > APP_VERSION)) return;
    let tried = null; try { tried = sessionStorage.getItem('sudoku-reload-for'); } catch (e) {}
    if (tried === String(latest)) return; // 서버 반영이 덜 된 경우 무한 새로고침 방지
    try { sessionStorage.setItem('sudoku-reload-for', String(latest)); } catch (e) {}
    if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
    location.reload();
  } catch (e) {}
}
checkLatest();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkLatest(); });
window.addEventListener('pageshow', e => { if (e.persisted) checkLatest(); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(reg => {
        // 앱을 다시 화면에 띄울 때마다 새 버전이 있는지 확인
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
      })
      .catch(() => {});
  });
  // 새 버전이 설치되면 한 번 새로고침해서 바로 반영 (진행 상황은 브라우저에 저장돼 있어 유지됨)
  if (navigator.serviceWorker.controller) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  }
}
</script>
